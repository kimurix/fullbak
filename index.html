<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#16261A">
<title>Full Bak Points</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--gold:#E8C98A;--cream:#F7ECD8;--line:rgba(232,201,138,.45);
--glass:linear-gradient(180deg,rgba(20,46,28,.52),rgba(10,28,16,.62))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:#16261A;color:var(--cream);
font-family:'Nunito',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
overscroll-behavior:none;-webkit-font-smoothing:antialiased}
#bg{position:fixed;inset:0;z-index:0;background:#16261A url('bg.png') center top/cover no-repeat}
#bg::after{content:"";position:absolute;inset:0;pointer-events:none;
background:radial-gradient(95% 70% at 50% 40%,rgba(0,0,0,0) 50%,rgba(0,0,0,.35) 100%)}
#snow{position:fixed;inset:0;z-index:1;width:100%;height:100%;pointer-events:none}
#app{position:fixed;inset:0;z-index:2;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
padding:calc(env(safe-area-inset-top,0px) + 20px) 26px calc(env(safe-area-inset-bottom,0px) + 40px);
scrollbar-width:none}
#app::-webkit-scrollbar{display:none}
.wrap{max-width:330px;margin:0 auto}
.card{border-radius:24px;border:1.5px solid var(--line);background:var(--glass);
backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
box-shadow:0 14px 34px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08);
padding:16px;margin-bottom:13px}
.hello{background:linear-gradient(160deg,#9E2118 0%,#7A1512 45%,#4E0C0C 100%);
border-color:rgba(232,201,138,.55);box-shadow:0 16px 38px rgba(40,3,3,.65),inset 0 1px 0 rgba(255,255,255,.16);
position:relative;overflow:hidden;padding:18px}
.hello::before{content:"";position:absolute;inset:0;pointer-events:none;
background:radial-gradient(110% 90% at 85% -25%,rgba(255,255,255,.14),rgba(255,255,255,0) 60%)}
.hello h1{margin:0 0 9px;font-size:23px;font-weight:800;line-height:1.2;color:#fff;
text-shadow:0 2px 12px rgba(0,0,0,.45);position:relative}
.hello p{margin:0;font-size:12.5px;line-height:1.5;color:rgba(255,246,238,.94);max-width:70%;position:relative}
.hello .holly{position:absolute;right:12px;top:50%;transform:translateY(-50%);pointer-events:none}
.ctitle{font-size:15px;font-weight:800;color:#fff}
.phead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.phead .cost{font-size:12px;color:rgba(247,236,216,.78);white-space:nowrap}
.phead .cost b{color:#fff;font-weight:800}
.pval{font-size:44px;font-weight:800;line-height:1;color:#fff;
text-shadow:0 4px 20px rgba(0,0,0,.55);margin-bottom:14px}
.barwrap{position:relative;height:18px;margin:0 8px}
.bar{position:absolute;inset:0;border-radius:99px;
background:linear-gradient(180deg,rgba(8,20,12,.8),rgba(20,40,26,.8));
border:1.5px solid rgba(232,201,138,.5);overflow:hidden;box-shadow:inset 0 2px 8px rgba(0,0,0,.6)}
.bar>i{display:block;height:100%;width:0;border-radius:99px;
background:linear-gradient(90deg,#E8C98A,#FFF0C4 55%,#E8C98A);
box-shadow:0 0 20px rgba(232,201,138,.9);transition:width .9s cubic-bezier(.2,.9,.2,1)}
.bar.ready>i{animation:barPulse .55s ease-in-out 3}
@keyframes barPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.8);box-shadow:0 0 32px rgba(255,240,196,1)}}
.thumb{position:absolute;top:50%;left:0;transform:translate(-50%,-50%);
transition:left .9s cubic-bezier(.2,.9,.2,1);pointer-events:none;
filter:drop-shadow(0 3px 6px rgba(0,0,0,.65))}
.phint{margin-top:14px;padding-top:11px;border-top:1px solid rgba(232,201,138,.18);
font-size:12px;color:rgba(247,236,216,.72);text-align:center}
.phint b{color:var(--cream);font-weight:800}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
.stat{position:relative;border-radius:16px;border:1.5px solid rgba(232,201,138,.38);
background:linear-gradient(180deg,rgba(28,58,36,.55),rgba(14,36,22,.55));
padding:24px 5px 11px;text-align:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
.stat .bow{position:absolute;top:-20px;left:50%;transform:translateX(-50%);width:56px;height:37px;
filter:drop-shadow(0 4px 7px rgba(0,0,0,.6))}
.stat b{display:block;font-size:24px;font-weight:800;line-height:1.1;color:#fff}
.stat span{display:block;font-size:10.5px;color:rgba(247,236,216,.7);margin-top:3px}
.rwrap{display:flex;justify-content:center;margin:20px 0 12px}
.ribbon{position:relative;display:flex;align-items:center;justify-content:center;gap:12px;
padding:12px 30px;font-size:18px;font-weight:800;color:#FFEECB;
background:linear-gradient(180deg,#B92E22,#6E1212);border:2px solid rgba(232,201,138,.95);
border-radius:14px;box-shadow:0 16px 34px rgba(0,0,0,.6),
inset 0 0 0 3px rgba(232,201,138,.22),inset 0 1px 0 rgba(255,255,255,.2)}
.ribbon svg{width:20px;height:20px;flex:0 0 auto}
.wbox{position:relative;width:min(84vw,330px);margin:0 auto 6px;aspect-ratio:1/1}
.pointer{position:absolute;left:50%;top:0;transform:translateX(-50%);
width:11%;height:11%;z-index:3;pointer-events:none;
filter:drop-shadow(0 4px 9px rgba(0,0,0,.75))}
#wheel{width:100%;height:100%;display:block}
#spin{transform-origin:50% 50%;transform:rotate(0);will-change:transform}
#idle{transform-box:view-box;transform-origin:200px 200px;animation:idleSpin 80s linear infinite}
@keyframes idleSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.bulb{animation:bulbTw 3s ease-in-out infinite}
@keyframes bulbTw{0%,100%{opacity:.55}50%{opacity:1}}
.hub{position:absolute;left:50%;top:50%;width:19%;height:19%;transform:translate(-50%,-50%);
border-radius:50%;border:none;padding:0;
background:radial-gradient(circle at 36% 30%,#D8452F 0%,#B32222 55%,#7A1515 100%);
box-shadow:0 0 0 4px rgba(232,201,138,.95),0 0 30px rgba(232,201,138,.55),0 12px 30px rgba(0,0,0,.7);
display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s}
.hub:active{transform:translate(-50%,-50%) scale(.94)}
.hub svg{width:56%;height:56%}
.bonus{position:fixed;left:0;right:0;z-index:4;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
padding:0 26px;display:none;justify-content:center}
.bbtn{width:100%;max-width:330px;display:flex;align-items:center;gap:12px;padding:15px 20px;
border-radius:22px;border:1.5px solid rgba(232,201,138,.85);
background:linear-gradient(180deg,rgba(24,54,34,.94),rgba(12,34,20,.94));
backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
box-shadow:0 16px 36px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.12);
color:var(--cream);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.bbtn .t{flex:1 1 auto;text-align:left}
.prow{display:flex;align-items:center;gap:10px;padding:9px 0;
border-bottom:1px solid rgba(232,201,138,.13);font-size:13px}
.prow:last-child{border-bottom:none}
.pico{flex:0 0 28px;width:28px;height:28px}
.pico svg{width:100%;height:100%}
.pname{flex:1 1 auto;min-width:0;line-height:1.35}
.pname em{font-style:normal;color:rgba(247,236,216,.62)}
.tabs{display:flex;gap:6px;margin:12px 0}
.tab{flex:1;padding:9px 4px;border-radius:12px;border:1.5px solid rgba(232,201,138,.3);
background:rgba(255,255,255,.04);color:rgba(247,236,216,.65);font-size:12px;cursor:pointer;font-family:inherit}
.tab.on{background:rgba(232,201,138,.18);border-color:rgba(232,201,138,.7);color:#fff}
.trow{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:13px;
border-bottom:1px solid rgba(232,201,138,.1)}
.trow:last-child{border-bottom:none}
.trow.me{color:var(--gold)}
.tpos{flex:0 0 26px;display:flex;align-items:center;justify-content:center}
.tpos svg{width:24px;height:24px}
.tpos .num{font-weight:800;color:rgba(247,236,216,.55);font-size:13px}
.tname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcount{font-weight:800}
.thint{margin-top:10px;padding-top:10px;border-top:1px solid rgba(232,201,138,.15);
font-size:11px;color:rgba(247,236,216,.55);text-align:center}
.empty{font-size:13px;color:rgba(247,236,216,.55);padding:6px 0}
.modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
padding:24px;background:rgba(4,14,8,.75);backdrop-filter:blur(6px)}
.modal.on{display:flex}
.mcard{width:100%;max-width:300px;border-radius:24px;border:1.5px solid rgba(232,201,138,.7);
background:linear-gradient(180deg,rgba(24,54,34,.99),rgba(10,30,18,.99));
box-shadow:0 24px 60px rgba(0,0,0,.7);padding:24px 20px;text-align:center;
animation:pop .35s cubic-bezier(.2,1.2,.4,1)}
@keyframes pop{from{transform:scale(.86);opacity:0}to{transform:scale(1);opacity:1}}
.mcard .big{font-size:48px;line-height:1;margin-bottom:10px}
.mcard h3{margin:0 0 6px;font-size:19px;font-weight:800;color:#fff}
.mcard p{margin:0 0 18px;font-size:13px;color:rgba(247,236,216,.72);line-height:1.45}
.mcard button{width:100%;padding:14px;border-radius:14px;border:1.5px solid rgba(232,201,138,.7);
background:linear-gradient(180deg,#B92E22,#6E1212);color:#fff;font-size:15px;font-weight:700;
cursor:pointer;font-family:inherit}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);
transform:translate(-50%,20px);z-index:30;padding:12px 18px;border-radius:14px;
background:rgba(16,40,24,.97);border:1.5px solid rgba(232,201,138,.55);color:var(--cream);
font-size:13px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.55);opacity:0;pointer-events:none;
transition:opacity .25s,transform .25s;max-width:80vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="snow"></canvas>

<div id="app"><div class="wrap">

  <div class="card hello">
    <h1 id="hTitle">Привет!</h1>
    <p id="hText">Загружаем данные…</p>
    <svg class="holly" width="54" height="54" viewBox="0 0 56 56" aria-hidden="true">
      <defs>
        <linearGradient id="lf" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#3E8C4A"/><stop offset="1" stop-color="#1C4A26"/></linearGradient>
        <radialGradient id="br" cx="35%" cy="30%" r="70%">
          <stop offset="0" stop-color="#FF6B5A"/><stop offset="55%" stop-color="#C62828"/><stop offset="100%" stop-color="#7A1010"/></radialGradient>
      </defs>
      <path d="M28 30c-6-10-16-14-22-12 2 8 10 14 22 12z" fill="url(#lf)"/>

    </svg>
  </div>

  <div class="card points">
    <div class="phead">
      <span class="ctitle">Твои баллы</span>
      <span class="cost">Вращение — <b><span id="cost">100</span></b> баллов</span>
    </div>
    <div class="pval" id="pval">0</div>
    <div class="barwrap">
      <div class="bar" id="barBox"><i id="pbar"></i></div>
      <span class="thumb" id="pthumb">
        <svg width="30" height="30" viewBox="0 0 48 48" aria-hidden="true">
          <defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#D8452F"/><stop offset="1" stop-color="#7A1515"/></linearGradient></defs>
          <ellipse cx="24" cy="43" rx="14" ry="3" fill="rgba(0,0,0,.4)"/>
          <rect x="10" y="20" width="28" height="20" rx="3" fill="url(#pg)"/>
          <rect x="10" y="20" width="28" height="5.5" rx="2.5" fill="#E8C98A"/>
          <rect x="21.5" y="20" width="5" height="20" fill="#F2D79C"/>
          <path d="M24 20c-6 0-10-2.8-10-5.8S19.5 11 24 20c4.5-9 10-8.6 10-5.8S30 20 24 20z" fill="#F2D79C"/>
        </svg>
      </span>
    </div>
    <div class="phint" id="phint">Ещё <b>100</b> баллов, и можно крутить колесо</div>
  </div>

  <div class="card">
    <div class="ctitle">Твои комментарии</div>
    <div class="stats">
      <div class="stat">
        <svg class="bow" viewBox="0 0 64 42" aria-hidden="true">
          <defs>
            <linearGradient id="bwA" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#F0604A"/><stop offset="45%" stop-color="#C62828"/><stop offset="100%" stop-color="#7A1010"/>
            </linearGradient>
            <linearGradient id="bwB" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#FF8A72"/><stop offset="100%" stop-color="#B32222"/>
            </linearGradient>
          </defs>
          <path d="M32 22 C27 30 22 36 18 41 L25 39 L29 42 Z" fill="#8E1A16"/>
          <path d="M32 22 C37 30 42 36 46 41 L39 39 L35 42 Z" fill="#8E1A16"/>
          <path d="M32 21 C23 5 4 1 2 12 C0 23 16 31 32 21 Z" fill="url(#bwA)"/>
          <path d="M32 21 C41 5 60 1 62 12 C64 23 48 31 32 21 Z" fill="url(#bwA)"/>
          <path d="M28 18 C21 8 9 5 6 11 C4 16 12 21 22 20" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2" stroke-linecap="round"/>
          <path d="M36 18 C43 8 55 5 58 11 C60 16 52 21 42 20" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2" stroke-linecap="round"/>
          <ellipse cx="32" cy="21" rx="6" ry="6.5" fill="url(#bwB)"/>
          <ellipse cx="30" cy="19" rx="2.4" ry="1.8" fill="rgba(255,255,255,.55)"/>
        </svg>
        <b id="cWeek">0</b><span>за 7 дней</span>
      </div>
      <div class="stat">
        <svg class="bow" viewBox="0 0 64 42" aria-hidden="true">
          <path d="M32 22 C27 30 22 36 18 41 L25 39 L29 42 Z" fill="#8E1A16"/>
          <path d="M32 22 C37 30 42 36 46 41 L39 39 L35 42 Z" fill="#8E1A16"/>
          <path d="M32 21 C23 5 4 1 2 12 C0 23 16 31 32 21 Z" fill="url(#bwA)"/>
          <path d="M32 21 C41 5 60 1 62 12 C64 23 48 31 32 21 Z" fill="url(#bwA)"/>
          <path d="M28 18 C21 8 9 5 6 11 C4 16 12 21 22 20" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2" stroke-linecap="round"/>
          <path d="M36 18 C43 8 55 5 58 11 C60 16 52 21 42 20" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2" stroke-linecap="round"/>
          <ellipse cx="32" cy="21" rx="6" ry="6.5" fill="url(#bwB)"/>
          <ellipse cx="30" cy="19" rx="2.4" ry="1.8" fill="rgba(255,255,255,.55)"/>
        </svg>
        <b id="cMonth">0</b><span>за 30 дней</span>
      </div>
      <div class="stat">
        <svg class="bow" viewBox="0 0 64 42" aria-hidden="true">
          <path d="M32 22 C27 30 22 36 18 41 L25 39 L29 42 Z" fill="#8E1A16"/>
          <path d="M32 22 C37 30 42 36 46 41 L39 39 L35 42 Z" fill="#8E1A16"/>
          <path d="M32 21 C23 5 4 1 2 12 C0 23 16 31 32 21 Z" fill="url(#bwA)"/>
          <path d="M32 21 C41 5 60 1 62 12 C64 23 48 31 32 21 Z" fill="url(#bwA)"/>
          <path d="M28 18 C21 8 9 5 6 11 C4 16 12 21 22 20" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2" stroke-linecap="round"/>

  <div class="rwrap">
    <div class="ribbon">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.6 6.4L21 11l-6.4 2.6L12 20l-2.6-6.4L3 11l6.4-2.6z" fill="#F2D79C"/></svg>
      Колесо призов
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.6 6.4L21 11l-6.4 2.6L12 20l-2.6-6.4L3 11l6.4-2.6z" fill="#F2D79C"/></svg>
    </div>
  </div>

  <div class="wbox">
    <svg class="pointer" viewBox="0 0 40 34" aria-hidden="true">
      <path d="M20 32 L3 7 Q20 -3 37 7 Z" fill="#E8C98A" stroke="#6B4F1C" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M20 25 L11 10 Q20 5 29 10 Z" fill="#FFF0C4" opacity=".75"/>
    </svg>
    <svg id="wheel" viewBox="0 0 400 400" aria-hidden="true"></svg>
    <button class="hub" id="hub" aria-label="Крутить">

    <div class="ctitle">Самые активные</div>

      <button class="tab on" data-p="week">7 дней</button>

      <button class="tab" data-p="all">Всё время</button>

    <div class="ctitle">Призы</div>

<div class="bonus" id="bonusBar">
  <button class="bbtn" id="bonusBtn">
    <svg width="24" height="24" viewBox="0 0 48 48" aria-hidden="true">

      <rect x="10" y="20" width="28" height="5.5" rx="2.5" fill="#E8C98A"/>

      <path d="M9 5l7 7-7 7" fill="none" stroke="#E8C98A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</div>

<div class="modal" id="modal">
  <div class="mcard">
    <div class="big" id="mIco">🎉</div>
    <h3 id="mTitle">Поздравляем!</h3>
    <p id="mText"></p>
    <button id="mClose">Отлично</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const API="https://tg-activity-bot.katka-69.workers.dev";
const tg=window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null;
if(tg){try{tg.ready();tg.expand();tg.setHeaderColor&&tg.setHeaderColor("#16261A");tg.setBackgroundColor&&tg.setBackgroundColor("#16261A")}catch(e){}}
const initData=tg&&tg.initData?tg.initData:"";
const PREVIEW=!initData;
const $=id=>document.getElementById(id);
const state={data:null,period:"week",spinning:false,angle:0,prizes:[],lastPts:null,cycleDone:false};

async function api(p,b){
  const r=await fetch(API+p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})});
  return r.json();
}
function previewData(){return{
  user:{id:1,name:"@pln_bak",points:0},daily_bonus:50,

const SEG=["#F7ECD8","#8E1A16","#F7ECD8","#1B4A2E"];
function polar(cx,cy,r,d){const a=(d-90)*Math.PI/180;return[cx+r*Math.cos(a),cy+r*Math.sin(a)]}

function renderWheel(list){
  const svg=$("wheel"),n=Math.max(list.length,1),seg=360/n,cx=200,cy=200,R=152;
  let defs=`<defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6B4F1C"/><stop offset="30%" stop-color="#B8912F"/>
      <stop offset="55%" stop-color="#7A5A20"/><stop offset="100%" stop-color="#4A3510"/></linearGradient>
    <radialGradient id="bulbG"><stop offset="0" stop-color="#FFF6D6"/><stop offset="40%" stop-color="#FFD98A" stop-opacity=".9"/><stop offset="100%" stop-color="#FFC85A" stop-opacity="0"/></radialGradient>
    <filter id="ishadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#000" flood-opacity=".55"/></filter>
    <filter id="bglow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="4"/></filter>
  </defs>`;
  let s="";
  for(let i=0;i<n;i++){
    const a0=i*seg,a1=(i+1)*seg;
    const [x0,y0]=polar(cx,cy,R,a0),[x1,y1]=polar(cx,cy,R,a1);
    s+=`<path d="M${cx} ${cy} L${x0.toFixed(1)} ${y0.toFixed(1)} A${R} ${R} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)} Z"
      fill="${SEG[i%SEG.length]}" stroke="rgba(0,0,0,.18)" stroke-width="1"/>`;
  }
  let ic="";
  for(let i=0;i<n;i++){
    const mid=i*seg+seg/2,[ix,iy]=polar(cx,cy,R*0.63,mid);
    const size=Math.min(46,Math.max(30,190/n+22));
    ic+=`<g transform="translate(${ix.toFixed(1)} ${iy.toFixed(1)}) rotate(${mid.toFixed(1)}) translate(${-size/2} ${-size/2})" filter="url(#ishadow)">
      <svg width="${size}" height="${size}" viewBox="0 0 48 48" overflow="visible">${iconAt(i)}</svg></g>`;
  }
  let bulbs="";
  const B=24;
  for(let i=0;i<B;i++){
    const [bx,by]=polar(cx,cy,R+24,(360/B)*i);
    const d=(i*0.13).toFixed(2);
    bulbs+=`<circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="15" fill="url(#bulbG)" filter="url(#bglow)" class="bulb" style="animation-delay:${d}s"/>
    <circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="4.4" fill="#FFF3C4" class="bulb" style="animation-delay:${d}s"/>`;
  }
  svg.innerHTML=defs+`
    <circle cx="${cx}" cy="${cy}" r="${R+34}" fill="url(#rim)"/>
    <circle cx="${cx}" cy="${cy}" r="${R+32}" fill="none" stroke="rgba(232,201,138,.55)" stroke-width="1.5"/>
    <circle cx="${cx}" cy="${cy}" r="${R+15}" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="2"/>
    <g id="spin"><g id="idle"><circle cx="${cx}" cy="${cy}" r="${R}" fill="#0B2417"/>${s}${ic}</g></g>
    ${bulbs}`;
}

function spinTo(idx,n){
  const idle=document.getElementById("idle");
  if(idle){idle.style.animation="none";idle.style.transform="rotate(0deg)";void idle.getBoundingClientRect()}
  const seg=360/n,center=idx*seg+seg/2;
  const base=state.angle-state.angle%360;
  const target=base+360*5+((360-center)%360);
  state.angle=target;
  const el=document.getElementById("spin");
  if(!el)return;
  el.style.transition="transform 4.6s cubic-bezier(.16,.86,.06,1)";
  el.style.transform=`rotate(${target}deg)`;
  setTimeout(()=>{if(idle)idle.style.animation="idleSpin 80s linear infinite"},4900);
}

const strip=s=>String(s==null?"":s)
  .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{2190}-\u{21FF}]/gu,"")
  .replace(/\s{2,}/g," ").trim();

function setBar(pct){
  $("pbar").style.width=pct+"%";
  $("pthumb").style.left=pct+"%";
}
function updateBar(pts,cost){
  const full=pts>=cost;
  const pct=full?100:(pts%cost)/cost*100;
  if(pts!==state.lastPts){state.lastPts=pts;state.cycleDone=false}
  setBar(pct);
  if(full&&!state.cycleDone){
    state.cycleDone=true;
    $("barBox").classList.add("ready");
    setTimeout(()=>{
      setBar(0);
      $("barBox").classList.remove("ready");
    },1900);
  }
}

function startSnow(){
  const cv=$("snow"),ctx=cv.getContext("2d");
  let W=0,H=0,dpr=Math.min(window.devicePixelRatio||1,2),fl=[],gl=[];
  function resize(){
    W=cv.clientWidth;H=cv.clientHeight;
    cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.round(W*H/16000);
    fl=Array.from({length:Math.min(Math.max(n,35),110)},()=>nf(true));
    gl=Array.from({length:26},()=>ng(true));
  }
  const nf=i=>({x:Math.random()*W,y:i?Math.random()*H:-10,r:.7+Math.random()*2,
    vy:.18+Math.random()*.5,vx:(Math.random()-.5)*.2,ph:Math.random()*6.28,sp:.4+Math.random()*.9,
    a:.3+Math.random()*.45});
  const ng=i=>({x:Math.random()*W,y:i?Math.random()*H:-10,r:.6+Math.random()*1.3,
    vy:.1+Math.random()*.3,vx:(Math.random()-.5)*.3,ph:Math.random()*6.28,sp:1.4+Math.random()*2});
  let t=0;
  function frame(){
    t+=.016;ctx.clearRect(0,0,W,H);
    for(const f of fl){
      f.y+=f.vy;f.x+=f.vx+Math.sin(t*f.sp+f.ph)*.26;
      if(f.y>H+8)Object.assign(f,nf(false));
      if(f.x<-8)f.x=W+8;if(f.x>W+8)f.x=-8;
      const tw=.72+.28*Math.sin(t*f.sp*1.7+f.ph);
      ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,6.283);
      ctx.fillStyle=`rgba(240,248,255,${(f.a*tw).toFixed(3)})`;ctx.fill();
    }
    for(const g of gl){
      g.y+=g.vy;g.x+=g.vx+Math.sin(t*.7+g.ph)*.16;
      if(g.y>H+8)Object.assign(g,ng(false));
      if(g.x<-8)g.x=W+8;if(g.x>W+8)g.x=-8;
      const k=Math.max(0,Math.sin(t*g.sp+g.ph));if(k<.05)continue;
      const r=g.r*(.6+k*1.5);
      const gr=ctx.createRadialGradient(g.x,g.y,0,g.x,g.y,r*4);
      gr.addColorStop(0,`rgba(255,240,200,${(.85*k).toFixed(3)})`);
      gr.addColorStop(1,"rgba(255,220,150,0)");
      ctx.fillStyle=gr;ctx.beginPath();ctx.arc(g.x,g.y,r*4,0,6.283);ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  resize();window.addEventListener("resize",resize);requestAnimationFrame(frame);
}

  if(PREVIEW){state.data=previewData();renderAll();return}
  try{const d=await api("/api/me",{initData});
    if(d.error){toast("Не удалось авторизоваться");return}
    state.data=d;renderAll();
  }catch(e){toast("Не получилось загрузить данные")}
}
async function doSpin(){
  if(state.spinning)return;const d=state.data;if(!d)return;
  const cost=d.spin_cost||100;
  if((d.user.points||0)<cost){toast("Не хватает баллов");return}
  state.spinning=true;
  if(PREVIEW){
    const n=Math.max(state.prizes.length,1),idx=Math.floor(Math.random()*n);
    spinTo(idx,n);
    setTimeout(()=>{state.spinning=false;
      const p=state.prizes[idx];
      showModal("🎉","Демо-режим",`Выпало: ${strip(p?p.name:"—")}. В Telegram здесь будет настоящий приз.`)},4800);
    return;
  }
  try{
    const r=await api("/api/spin",{initData});
    if(r.error){state.spinning=false;toast(r.message||"Не удалось крутить");return}
    const list=r.prizes||state.prizes,n=Math.max(list.length,1);
    const idx=Math.max(0,list.findIndex(p=>p.id===(r.prize&&r.prize.id)));
    spinTo(idx,n);
    setTimeout(()=>{
      state.spinning=false;
      if(r.points!=null&&state.data)state.data.user.points=r.points;
      if(r.prizes)state.prizes=r.prizes;
      renderAll();
      const nm=strip(r.prize?r.prize.name:"—");
      const b=r.nothing_bonus?` Начислено +${r.nothing_bonus} баллов.`:"";
      showModal("🎉","Поздравляем!",`Вам выпало: ${nm}.${b} Остаток баллов: ${r.points}.`);
    },4800);
  }catch(e){state.spinning=false;toast("Ошибка сети, попробуйте ещё раз")}
}

$("hub").addEventListener("click",doSpin);
$("mClose").addEventListener("click",()=>$("modal").classList.remove("on"));
$("modal").addEventListener("click",e=>{if(e.target.id==="modal")$("modal").classList.remove("on")});
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
  t.classList.add("on");state.period=t.dataset.p;renderTop();
}));

startSnow();
load();
</script>
</body>
</html>
