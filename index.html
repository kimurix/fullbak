<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#122016" />
<title>Full Bak Points</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --cream:#f4ecda;
    --cream-dim:rgba(244,236,218,.70);
    --gold:#e0c084;
    --card-a:rgba(62,78,58,.92);
    --card-b:rgba(44,58,44,.94);
    --card-line:rgba(158,176,138,.32);
    --red-a:#9c2320;
    --red-b:#6e1212;
    --pink:#ff5c8a;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0; padding:0; height:100%;
    background:#0d1a12;
    color:var(--cream);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    overscroll-behavior:none;
    -webkit-font-smoothing:antialiased;
  }

  /* ================= ФОН ================= */
  #bg{
    position:fixed; inset:0; z-index:0; overflow:hidden;
    background:
      radial-gradient(70% 38% at 50% 0%, #2f5136 0%, rgba(47,81,54,0) 70%),
      radial-gradient(50% 30% at 6% 20%, #2a4a32 0%, rgba(42,74,50,0) 78%),
      radial-gradient(50% 30% at 94% 24%, #2a4a32 0%, rgba(42,74,50,0) 78%),
      radial-gradient(80% 26% at 50% 100%, #2b5038 0%, rgba(43,80,56,0) 76%),
      linear-gradient(180deg, #1b2e20 0%, #16261a 40%, #101d14 72%, #0b1610 100%);
  }
  #bg::after{
    content:"";
    position:absolute; inset:0;
    background:radial-gradient(92% 62% at 50% 40%, rgba(0,0,0,0) 48%, rgba(0,0,0,.45) 100%);
    pointer-events:none;
  }
  #treeLayer{ position:absolute; inset:0; width:100%; height:100%; }
  #snowCanvas{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  #bottomLayer{
    position:absolute; left:0; right:0; bottom:0;
    height:min(48vh, 400px);
    pointer-events:none;
  }

  .bulb{ animation:bulbTwinkle 3.4s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  @keyframes bulbTwinkle{
    0%,100%{ opacity:.40; filter:drop-shadow(0 0 3px rgba(255,225,160,.5)); }
    45%{ opacity:1; filter:drop-shadow(0 0 12px rgba(255,230,170,1)); }
    62%{ opacity:.85; filter:drop-shadow(0 0 7px rgba(255,225,160,.85)); }
  }
  .bokeh{ animation:bokehPulse 5.5s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  @keyframes bokehPulse{ 0%,100%{ opacity:.30; } 50%{ opacity:.95; } }

  /* ================= КОНТЕНТ ================= */
  #app{
    position:fixed; inset:0; z-index:2;
    overflow-y:auto; overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    padding:
      calc(env(safe-area-inset-top, 0px) + 4px)
      14px
      calc(env(safe-area-inset-bottom, 0px) + 270px);
    scrollbar-width:none;
  }
  #app::-webkit-scrollbar{ display:none; }
  .wrap{ max-width:440px; margin:0 auto; }

  /* ---------- статус-бар ---------- */
  .statusbar{
    max-width:440px; margin:0 auto 6px;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 8px;
    height:26px;
    color:#fff;
    font-size:15px; font-weight:600; letter-spacing:.2px;
  }
  .statusbar .icons{ display:flex; align-items:center; gap:6px; opacity:.95; }

  /* ---------- шапка ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px; margin-bottom:14px;
  }
  .iconbtn{
    width:44px; height:44px; flex:0 0 44px;
    border-radius:50%;
    border:none;
    background:linear-gradient(180deg,#fbf6ea,#e8dfcc);
    color:#2a2a24;
    display:flex; align-items:center; justify-content:center;
    font-size:18px; line-height:1; cursor:pointer;
    box-shadow:0 6px 16px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.9);
    transition:transform .15s ease;
  }
  .iconbtn:active{ transform:scale(.93); }

  .brand{
    flex:1 1 auto; text-align:center;
    padding:9px 16px;
    border-radius:18px;
    border:1px solid rgba(224,192,132,.55);
    background:linear-gradient(180deg, rgba(58,76,54,.92), rgba(38,52,38,.92));
    box-shadow:0 10px 24px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.10);
  }
  .brand b{ display:block; font-size:16.5px; font-weight:600; letter-spacing:.2px; }
  .brand span{ display:block; font-size:11.5px; color:var(--cream-dim); margin-top:2px; }

  /* ---------- карточки ---------- */
  .card{
    border-radius:24px;
    border:1px solid var(--card-line);
    background:linear-gradient(180deg, var(--card-a), var(--card-b));
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    box-shadow:0 16px 36px rgba(0,0,0,.48), inset 0 1px 0 rgba(255,255,255,.10);
    padding:16px;
    margin-bottom:14px;
  }

  /* приветствие */
  .hello{
    background:linear-gradient(160deg, #a8271f 0%, var(--red-a) 45%, var(--red-b) 100%);
    border-color:rgba(224,192,132,.40);
    box-shadow:0 18px 40px rgba(60,6,6,.55), inset 0 1px 0 rgba(255,255,255,.18);
    position:relative; overflow:hidden;
    padding:18px;
  }
  .hello::before{
    content:"";
    position:absolute; inset:0;
    background:
      radial-gradient(110% 90% at 88% -20%, rgba(255,255,255,.18), rgba(255,255,255,0) 62%),
      radial-gradient(70% 60% at 0% 120%, rgba(255,130,100,.22), rgba(255,130,100,0) 70%);
    pointer-events:none;
  }
  .hello h1{
    margin:0 0 8px;
    font-family:Georgia,"Times New Roman",serif;
    font-size:25px; font-weight:600; line-height:1.2;
    color:#fff8f0;
    text-shadow:0 2px 12px rgba(0,0,0,.40);
    position:relative;
  }
  .hello p{
    margin:0; font-size:13px; line-height:1.5;
    color:rgba(255,242,234,.95);
    max-width:76%;
    position:relative;
  }
  .hello .flake{
    position:absolute; right:14px; top:50%; transform:translateY(-50%);
    opacity:.85; pointer-events:none;
  }

  /* ---------- плашка баллов с вырезом ---------- */
  .points{
    position:relative;
    margin-top:30px;
    padding:0;
    border-radius:24px;
    border:1px solid var(--card-line);
    background:linear-gradient(180deg, var(--card-a), var(--card-b));
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    box-shadow:0 16px 36px rgba(0,0,0,.48), inset 0 1px 0 rgba(255,255,255,.10);
    margin-bottom:14px;
  }
  .points-tabs{
    position:absolute; top:-29px; left:0; right:0;
    height:32px;
    display:flex;
  }
  .ptab{
    background:linear-gradient(180deg, rgba(66,84,62,.98), rgba(58,74,56,.98));
    border:1px solid var(--card-line);
    border-bottom:none;
    padding:0 15px;
    display:flex; align-items:center;
    font-size:12.5px; color:var(--cream);
    white-space:nowrap;
  }
  .ptab-l{ border-radius:18px 0 0 0; border-bottom-right-radius:16px; flex:0 0 auto; }
  .ptab-r{ border-radius:0 18px 0 0; border-bottom-left-radius:16px; flex:1 1 auto; justify-content:flex-end; }
  .ptab b{ color:var(--cream); font-weight:600; }

  .points-top{
    display:flex; align-items:flex-start; justify-content:space-between;
    gap:12px; padding:14px 16px 0;
  }
  .points-label{ font-size:13px; color:var(--cream-dim); margin-bottom:2px; }
  .points-value{
    display:flex; align-items:center; gap:8px;
    font-size:40px; font-weight:700; line-height:1;
    letter-spacing:-1px;
    text-shadow:0 4px 18px rgba(0,0,0,.5);
  }
  .points-value .heart{ font-size:22px; filter:drop-shadow(0 0 10px rgba(255,70,120,.75)); }

  .points-mid{
    display:flex; align-items:center; gap:10px;
    padding:12px 16px 0;
  }
  .gift-ico{ flex:0 0 auto; filter:drop-shadow(0 6px 10px rgba(0,0,0,.55)); }
  .bar{
    flex:1 1 auto; height:18px; border-radius:99px;
    background:linear-gradient(180deg, rgba(96,110,88,.55), rgba(74,88,68,.55));
    border:1px solid rgba(158,176,138,.30);
    overflow:hidden;
    box-shadow:inset 0 2px 6px rgba(0,0,0,.40);
  }
  .bar > i{
    display:block; height:100%; width:0%;
    border-radius:99px;
    background:linear-gradient(90deg, #e0c084, #fff0c4 55%, #e0c084);
    box-shadow:0 0 16px rgba(224,192,132,.8);
    transition:width .8s cubic-bezier(.2,.9,.2,1);
  }
  .points-hint{
    padding:12px 16px 16px;
    font-size:12.5px; color:var(--cream-dim);
    border-top:1px solid rgba(158,176,138,.22);
    margin-top:14px;
  }
  .points-hint b{ color:var(--cream); }

  /* ---------- комментарии ---------- */
  .card-title{
    display:flex; align-items:center; gap:7px;
    font-size:14px; font-weight:600; margin-bottom:12px;
  }
  .stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
  .stat{
    border-radius:15px;
    border:1px solid rgba(158,176,138,.35);
    background:linear-gradient(180deg, rgba(84,104,76,.72), rgba(56,72,52,.72));
    padding:12px 5px 10px;
    text-align:center;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
  }
  .stat b{ display:block; font-size:23px; font-weight:700; line-height:1.1; }
  .stat span{ display:block; font-size:10.5px; color:var(--cream-dim); margin-top:3px; }

  /* ---------- лента ---------- */
  .ribbon{
    position:relative;
    margin:20px auto 12px;
    max-width:300px;
    display:flex; align-items:center; justify-content:center; gap:9px;
    padding:9px 26px;
    font-family:Georgia,"Times New Roman",serif;
    font-size:17px; letter-spacing:.3px;
    color:#ffeecb;
    background:linear-gradient(180deg, #a8271f, #6e1212);
    border:1.5px solid rgba(224,192,132,.90);
    border-radius:9px;
    box-shadow:0 12px 28px rgba(0,0,0,.55), inset 0 0 0 3px rgba(224,192,132,.18);
  }
  .ribbon::before,.ribbon::after{
    content:"";
    position:absolute; top:0; bottom:0; width:15px;
    background:linear-gradient(180deg, #a8271f, #6e1212);
  }
  .ribbon::before{ left:-14px; clip-path:polygon(100% 0, 0 50%, 100% 100%); }
  .ribbon::after{ right:-14px; clip-path:polygon(0 0, 100% 50%, 0 100%); }
  .ribbon svg{ width:17px; height:17px; flex:0 0 auto; opacity:.95; }

  /* ---------- колесо ---------- */
  .wheel-box{
    position:relative;
    width:min(94vw, 400px);
    margin:0 auto 6px;
    aspect-ratio:1/1;
  }
  #wheelSvg{ width:100%; height:100%; display:block; filter:drop-shadow(0 20px 38px rgba(0,0,0,.6)); }
  #wheelSpin{ transform-origin:50% 50%; transform:rotate(0deg); will-change:transform; }
  .rim-bulb{ animation:rimTwinkle 2.6s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  @keyframes rimTwinkle{ 0%,100%{ opacity:.45; } 50%{ opacity:1; } }
  .hub{
    position:absolute; left:50%; top:50%;
    width:16%; height:16%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    border:none; padding:0;
    background:radial-gradient(circle at 36% 30%, #e04b3a 0%, #b32222 55%, #7d1414 100%);
    box-shadow:0 0 0 3px rgba(224,192,132,.80), 0 12px 26px rgba(0,0,0,.65);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:transform .15s ease;
  }
  .hub:active{ transform:translate(-50%,-50%) scale(.94); }
  .hub svg{ width:56%; height:56%; }

  /* ---------- кнопка ---------- */
  .spin-btn{
    position:relative;
    display:block; width:100%;
    margin:16px 0 10px;
    padding:18px 22px;
    border-radius:20px;
    border:2px solid rgba(224,192,132,.90);
    background:linear-gradient(180deg, #b32d22 0%, #9c2320 52%, #6e1212 100%);
    color:#fff6ea;
    font-family:Georgia,"Times New Roman",serif;
    font-size:17px; font-weight:600; letter-spacing:.3px;
    text-shadow:0 2px 10px rgba(0,0,0,.5);
    box-shadow:
      0 18px 40px rgba(60,6,6,.55),
      inset 0 1px 0 rgba(255,255,255,.30),
      inset 0 -3px 12px rgba(0,0,0,.42);
    cursor:pointer;
    overflow:hidden;
    transition:transform .15s ease, filter .2s ease;
  }
  .spin-btn::before{
    content:"";
    position:absolute; inset:4px;
    border-radius:16px;
    border:1px solid rgba(255,225,170,.28);
    pointer-events:none;
  }
  .spin-btn::after{
    content:"";
    position:absolute; top:-10%; bottom:-10%; width:55%;
    background:linear-gradient(100deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.32) 50%, rgba(255,255,255,0) 100%);
    transform:translateX(-160%);
    animation:shimmer 4s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes shimmer{ 0%{ transform:translateX(-160%); } 55%,100%{ transform:translateX(280%); } }
  .spin-btn:active{ transform:scale(.985); filter:brightness(1.08); }
  .spin-btn:disabled{ opacity:.6; cursor:default; }
  .spin-btn:disabled::after{ animation:none; }

  /* ---------- призы ---------- */
  .prize-row{
    display:flex; align-items:center; gap:12px;
    padding:10px 0;
    border-bottom:1px solid rgba(158,176,138,.18);
    font-size:13.5px;
  }
  .prize-row:last-child{ border-bottom:none; }
  .prize-ico{ flex:0 0 32px; width:32px; height:32px; display:flex; align-items:center; justify-content:center; }
  .prize-ico svg{ width:100%; height:100%; }
  .prize-name{ flex:1 1 auto; min-width:0; word-break:break-word; line-height:1.4; }
  .prize-name em{ font-style:normal; color:var(--cream-dim); }
  .prize-stock{ font-size:11px; color:var(--cream-dim); }

  /* ---------- топы ---------- */
  .tabs{ display:flex; gap:7px; margin-bottom:12px; }
  .tab{
    flex:1 1 0; padding:9px 4px;
    border-radius:12px;
    border:1px solid rgba(158,176,138,.28);
    background:rgba(255,255,255,.05);
    color:var(--cream-dim);
    font-size:12.5px; cursor:pointer;
    transition:.2s;
  }
  .tab.on{
    background:linear-gradient(180deg, rgba(224,192,132,.28), rgba(224,192,132,.12));
    border-color:rgba(224,192,132,.65);
    color:var(--cream);
  }
  .top-row{
    display:flex; align-items:center; gap:10px;
    padding:9px 0; font-size:13.5px;
    border-bottom:1px solid rgba(158,176,138,.16);
  }
  .top-row:last-child{ border-bottom:none; }
  .top-row.me{ color:var(--gold); }
  .top-pos{ flex:0 0 24px; text-align:center; font-weight:700; color:var(--cream-dim); }
  .top-name{ flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .top-c{ flex:0 0 auto; font-weight:600; }

  .empty{ font-size:13px; color:var(--cream-dim); padding:6px 0; }

  /* ---------- модалка / тост ---------- */
  .modal{
    position:fixed; inset:0; z-index:20;
    display:none; align-items:center; justify-content:center;
    padding:24px;
    background:rgba(6,14,9,.76);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  }
  .modal.on{ display:flex; }
  .modal-card{
    width:100%; max-width:330px;
    border-radius:24px;
    border:1.5px solid rgba(224,192,132,.60);
    background:linear-gradient(180deg, rgba(66,84,62,.98), rgba(24,38,26,.98));
    box-shadow:0 26px 64px rgba(0,0,0,.70);
    padding:24px 20px;
    text-align:center;
    animation:pop .35s cubic-bezier(.2,1.2,.4,1);
  }
  @keyframes pop{ from{ transform:scale(.86); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .modal-card .big{ font-size:50px; line-height:1; margin-bottom:10px; }
  .modal-card h3{ margin:0 0 8px; font-family:Georgia,serif; font-size:20px; font-weight:600; }
  .modal-card p{ margin:0 0 18px; font-size:13.5px; color:var(--cream-dim); line-height:1.5; }
  .modal-card button{
    width:100%; padding:14px; border-radius:14px;
    border:1px solid rgba(224,192,132,.55);
    background:linear-gradient(180deg,#a8271f,#6e1212);
    color:#fff6ea; font-size:15px; font-weight:600; cursor:pointer;
  }

  .toast{
    position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 26px);
    transform:translate(-50%, 20px);
    z-index:30;
    padding:12px 18px;
    border-radius:14px;
    background:rgba(58,76,54,.98);
    border:1px solid rgba(224,192,132,.60);
    color:var(--cream); font-size:13.5px;
    box-shadow:0 14px 34px rgba(0,0,0,.60);
    opacity:0; pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    max-width:88vw; text-align:center;
  }
  .toast.on{ opacity:1; transform:translate(-50%,0); }

  @media (prefers-reduced-motion: reduce){
    .bulb,.rim-bulb,.bokeh,.spin-btn::after{ animation:none; opacity:.85; }
  }
</style>
</head>
<body>

<div id="bg">
  <svg id="treeLayer" preserveAspectRatio="xMidYMid slice" viewBox="0 0 390 844" aria-hidden="true"></svg>
  <canvas id="snowCanvas" aria-hidden="true"></canvas>
  <svg id="bottomLayer" preserveAspectRatio="xMidYMax slice" viewBox="0 0 390 320" aria-hidden="true"></svg>
</div>

<div id="app">

  <div class="statusbar">
    <span>9:41</span>
    <span class="icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="#fff"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="6" width="3" height="6" rx="1"/><rect x="10" y="3.5" width="3" height="8.5" rx="1"/><rect x="15" y="1" width="3" height="11" rx="1"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"><path d="M1 4.2a10 10 0 0 1 14 0"/><path d="M3.6 7a6.4 6.4 0 0 1 8.8 0"/><circle cx="8" cy="10" r="1.1" fill="#fff" stroke="none"/></svg>
      <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="0.6" y="0.6" width="19" height="10.8" rx="3" stroke="#fff" stroke-opacity=".7" stroke-width="1.2"/><rect x="2.2" y="2.2" width="15.6" height="7.6" rx="2" fill="#fff"/><path d="M21.4 4.2v3.6c1-.3 1.6-.9 1.6-1.8s-.6-1.5-1.6-1.8z" fill="#fff" fill-opacity=".7"/></svg>
    </span>
  </div>

  <div class="wrap">

    <div class="topbar">
      <button class="iconbtn" id="btnClose" aria-label="Закрыть">✕</button>
      <div class="brand">
        <b>Full Bak Points</b>
        <span>мини-приложение</span>
      </div>
      <button class="iconbtn" id="btnMore" aria-label="Ещё">⋯</button>
    </div>

    <div class="card hello">
      <h1 id="helloTitle">Привет, @pln_bak! 💗</h1>
      <p id="helloText">Загружаем данные…</p>
      <svg class="flake" width="50" height="50" viewBox="0 0 48 48" fill="none" stroke="#e0c084" stroke-width="1.5" stroke-linecap="round">
        <path d="M24 6v36M8 15l32 18M40 15L8 33"/>
        <path d="M24 11l-4 4M24 11l4 4M24 37l-4-4M24 37l4-4M11 19l1 5M11 29l1-5M37 19l-1 5M37 29l-1-5"/>
      </svg>
    </div>

    <div class="points">
      <div class="points-tabs">
        <div class="ptab ptab-l">Твои баллы</div>
        <div class="ptab ptab-r">Вращение — <b>&nbsp;<span id="spinCostTab">100</span> баллов</b></div>
      </div>

      <div class="points-top">
        <div>
          <div class="points-label">Твои баллы</div>
          <div class="points-value">
            <span id="pointsVal">0</span>
            <span class="heart">💗</span>
          </div>
        </div>
      </div>

      <div class="points-mid">
        <svg class="gift-ico" width="34" height="34" viewBox="0 0 48 48" aria-hidden="true">
          <defs>
            <linearGradient id="pg1" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#f06a4f"/><stop offset="1" stop-color="#9e1f1f"/>
            </linearGradient>
            <linearGradient id="pg2" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fff0c4"/><stop offset="1" stop-color="#d4a63c"/>
            </linearGradient>
          </defs>
          <ellipse cx="24" cy="43" rx="14" ry="3" fill="rgba(0,0,0,.4)"/>
          <rect x="9" y="20" width="30" height="21" rx="3" fill="url(#pg1)"/>
          <rect x="9" y="20" width="30" height="6" rx="3" fill="url(#pg2)"/>
          <rect x="21" y="20" width="6" height="21" fill="url(#pg2)"/>
          <path d="M24 20c-6.5 0-11-3-11-6.2S19.5 10 24 20c4.5-10 11-9.2 11-6.2S30.5 20 24 20z" fill="url(#pg2)"/>
        </svg>

/* ================= ФОН: хвоя, шары, огни ================= */
function buildTree() {
  const svg = $("treeLayer");
  const W = 390, H = 844;

  const defs = `
    <defs>
      <linearGradient id="pBack" x1="0" y1="0" x2="1" y2="0.7">
        <stop offset="0" stop-color="#17361f"/><stop offset="1" stop-color="#0a1a10"/>
      </linearGradient>
      <linearGradient id="pMid" x1="0" y1="0" x2="1" y2="0.7">
        <stop offset="0" stop-color="#24512f"/><stop offset="1" stop-color="#0f2a19"/>
      </linearGradient>
      <linearGradient id="pFront" x1="0" y1="0" x2="1" y2="0.7">
        <stop offset="0" stop-color="#356e44"/><stop offset="1" stop-color="#153a22"/>
      </linearGradient>
      <radialGradient id="bulbGlow"><stop offset="0" stop-color="#fff2cc" stop-opacity="1"/><stop offset="1" stop-color="#ffcf6b" stop-opacity="0"/></radialGradient>
      <radialGradient id="ornRed" cx="34%" cy="26%" r="74%">
        <stop offset="0" stop-color="#ff9a82"/><stop offset="40%" stop-color="#b81f1f"/><stop offset="100%" stop-color="#5e0f0f"/>
      </radialGradient>
      <radialGradient id="ornGold" cx="34%" cy="26%" r="74%">
        <stop offset="0" stop-color="#fff6d6"/><stop offset="45%" stop-color="#dcb877"/><stop offset="100%" stop-color="#8a6524"/>
      </radialGradient>
      <radialGradient id="bokehG"><stop offset="0" stop-color="#ffe6b0" stop-opacity=".95"/><stop offset="1" stop-color="#ffd98a" stop-opacity="0"/></radialGradient>
    </defs>`;

  let body = "";

  const spray = (x, y, len, dir, fill, snowOp) => {
    const x1 = x + dir * len;
    let d = `M${x} ${y} Q ${(x + dir * len * 0.45).toFixed(1)} ${(y - 16).toFixed(1)} ${x1.toFixed(1)} ${(y + 6).toFixed(1)}`;
    d += ` Q ${(x + dir * len * 0.82).toFixed(1)} ${(y + 26).toFixed(1)} ${(x + dir * len * 0.62).toFixed(1)} ${(y + 30).toFixed(1)}`;
    d += ` Q ${(x + dir * len * 0.46).toFixed(1)} ${(y + 40).toFixed(1)} ${(x + dir * len * 0.30).toFixed(1)} ${(y + 34).toFixed(1)}`;
    d += ` Q ${(x + dir * len * 0.15).toFixed(1)} ${(y + 44).toFixed(1)} ${x} ${(y + 40).toFixed(1)} Z`;
    return `<path d="${d}" fill="${fill}"/>` +
      `<path d="M${x} ${y} Q ${(x + dir * len * 0.45).toFixed(1)} ${(y - 16).toFixed(1)} ${x1.toFixed(1)} ${(y + 6).toFixed(1)}"
        fill="none" stroke="rgba(240,250,255,${snowOp})" stroke-width="3.6" stroke-linecap="round"/>`;
  };

  for (let i = 0; i < 15; i++) {
    const y = 6 + i * 58;
    body += spray(-40, y, 78 + i * 4, 1, "url(#pBack)", 0.22);
    body += spray(W + 40, y + 26, 78 + i * 4, -1, "url(#pBack)", 0.22);
  }
  for (let i = 0; i < 15; i++) {
    const y = 26 + i * 58;
    body += spray(-44, y, 96 + i * 5, 1, "url(#pMid)", 0.38);
    body += spray(W + 44, y + 28, 96 + i * 5, -1, "url(#pMid)", 0.38);
  }
  for (let i = 0; i < 15; i++) {
    const y = 48 + i * 58;
    body += spray(-48, y, 112 + i * 6, 1, "url(#pFront)", 0.55);
    body += spray(W + 48, y + 30, 112 + i * 6, -1, "url(#pFront)", 0.55);
  }

  const berry = (x, y) => {
    let s = "";
    const pts = [[0,0],[7,-4],[-6,-5],[3,6],[-4,7]];
    for (const [dx, dy] of pts) {
      s += `<circle cx="${x + dx}" cy="${y + dy}" r="3.4" fill="#b81f1f"/>`;
      s += `<circle cx="${x + dx - 1}" cy="${y + dy - 1}" r="1.1" fill="rgba(255,180,170,.7)"/>`;
    }
    return s;
  };
  body += berry(34, 300) + berry(356, 250) + berry(26, 560) + berry(364, 600) + berry(48, 720);

  let bokeh = "";
  const spots = [
    [70,100,15],[150,58,11],[250,80,13],[330,132,17],[42,270,12],[352,300,15],
    [92,430,14],[300,480,12],[58,610,16],[332,650,13],[196,34,10],[210,740,11]
  ];
  spots.forEach(([x, y, r], i) => {
    bokeh += `<circle cx="${x}" cy="${y}" r="${r}" fill="url(#bokehG)" class="bokeh" style="animation-delay:${(i * 0.6).toFixed(1)}s"/>`;
  });

  const orn = (x, y, r, grad, cap, snowflake) => {
    let s = `
      <line x1="${x}" y1="0" x2="${x}" y2="${y - r - 4}" stroke="rgba(224,192,132,.55)" stroke-width="1.3"/>
      <rect x="${x - 4}" y="${y - r - 8}" width="8" height="9" rx="2" fill="${cap}"/>
      <circle cx="${x}" cy="${y}" r="${r}" fill="url(#${grad})"/>
      <ellipse cx="${(x - r * 0.34).toFixed(1)}" cy="${(y - r * 0.38).toFixed(1)}" rx="${(r * 0.30).toFixed(1)}" ry="${(r * 0.19).toFixed(1)}"
        fill="rgba(255,255,255,.62)" transform="rotate(-30 ${(x - r * 0.34).toFixed(1)} ${(y - r * 0.38).toFixed(1)})"/>`;
    if (snowflake) {
      s += `<g transform="translate(${x} ${y})" stroke="rgba(255,255,255,.85)" stroke-width="${(r * 0.09).toFixed(1)}" stroke-linecap="round" fill="none">
        <path d="M0 ${-r * 0.55} V ${r * 0.55} M ${-r * 0.48} ${-r * 0.28} L ${r * 0.48} ${r * 0.28} M ${r * 0.48} ${-r * 0.28} L ${-r * 0.48} ${r * 0.28}"/>
      </g>`;
    }
    return s;
  };

  const ornaments =
    orn(112, 96, 26, "ornRed", "#d4a63c", true) +
    orn(320, 128, 22, "ornGold", "#d4a63c", false) +
    orn(356, 218, 24, "ornRed", "#d4a63c", true) +
    orn(28, 186, 16, "ornGold", "#d4a63c", false) +
    orn(16, 440, 14, "ornRed", "#d4a63c", false) +
    orn(376, 500, 15, "ornGold", "#d4a63c", false);

  const colors = ["#ffe9b0", "#fff6d6", "#ffd98a", "#fffbe8"];
  let bulbs = "";
  let k = 0;
  for (let y = 52; y < H - 40; y += 42) {
    const xL = 24 + Math.sin(y / 38) * 10;
    const xR = W - 24 - Math.sin(y / 44) * 10;
    bulbs += `<circle cx="${xL.toFixed(1)}" cy="${y}" r="15" fill="url(#bulbGlow)" class="bulb" style="animation-delay:${(k * 0.31).toFixed(2)}s"/>`;
    bulbs += `<circle cx="${xL.toFixed(1)}" cy="${y}" r="3.2" fill="${colors[k % 4]}" class="bulb" style="animation-delay:${(k * 0.31).toFixed(2)}s"/>`;
    bulbs += `<circle cx="${xR.toFixed(1)}" cy="${y + 12}" r="15" fill="url(#bulbGlow)" class="bulb" style="animation-delay:${(k * 0.27 + 0.9).toFixed(2)}s"/>`;

    k++;
  }

  svg.innerHTML = defs + body + bokeh + bulbs + ornaments;
}

/* ================= СНЕГ И БЛЁСТКИ ================= */
function startSnow() {
  const cv = $("snowCanvas");
  const ctx = cv.getContext("2d");
  let W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
  let flakes = [], glints = [];

  function resize() {
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.floor(W * dpr); cv.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round((W * H) / 12000);
    flakes = Array.from({ length: Math.min(Math.max(n, 50), 150) }, () => newFlake(true));
    glints = Array.from({ length: 40 }, () => newGlint(true));
  }

  function newFlake(init) {
    return {
      x: Math.random() * W,
      y: init ? Math.random() * H : -10,
      r: 0.8 + Math.random() * 2.3,
      vy: 0.20 + Math.random() * 0.60,
      vx: (Math.random() - 0.5) * 0.24,
      ph: Math.random() * Math.PI * 2,
      sp: 0.4 + Math.random() * 0.9,
      a: 0.40 + Math.random() * 0.55,
    };
  }

  function newGlint(init) {
    return {
      x: Math.random() * W,
      y: init ? Math.random() * H : -10,
      r: 0.6 + Math.random() * 1.5,
      vy: 0.10 + Math.random() * 0.34,
      vx: (Math.random() - 0.5) * 0.36,
      ph: Math.random() * Math.PI * 2,
      sp: 1.4 + Math.random() * 2.2,
    };
  }

  let t = 0;
  function frame() {
    t += 0.016;
    ctx.clearRect(0, 0, W, H);

    for (const f of flakes) {
      f.y += f.vy;
      f.x += f.vx + Math.sin(t * f.sp + f.ph) * 0.30;
      if (f.y > H + 8) Object.assign(f, newFlake(false));
      if (f.x < -8) f.x = W + 8;
      if (f.x > W + 8) f.x = -8;
      const tw = 0.72 + 0.28 * Math.sin(t * f.sp * 1.7 + f.ph);
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(248,252,255,${(f.a * tw).toFixed(3)})`;
      ctx.fill();
    }

    for (const g of glints) {
      g.y += g.vy;
      g.x += g.vx + Math.sin(t * 0.7 + g.ph) * 0.18;
      if (g.y > H + 8) Object.assign(g, newGlint(false));
      if (g.x < -8) g.x = W + 8;
      if (g.x > W + 8) g.x = -8;
      const k = Math.max(0, Math.sin(t * g.sp + g.ph));
      if (k < 0.05) continue;
      const r = g.r * (0.6 + k * 1.6);
      const grad = ctx.createRadialGradient(g.x, g.y, 0, g.x, g.y, r * 4);
      grad.addColorStop(0, `rgba(255,244,210,${(0.95 * k).toFixed(3)})`);
      grad.addColorStop(1, "rgba(255,220,150,0)");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(g.x, g.y, r * 4, 0, Math.PI * 2);
      ctx.fill();
    }

    requestAnimationFrame(frame);
  }

  resize();
  window.addEventListener("resize", resize);
  requestAnimationFrame(frame);
}

/* ================= КОЛЕСО ================= */
const SEG_FILL = ["#f7ecd8", "#8f1d1d", "#f7ecd8", "#1f4a2e"];

function polar(cx, cy, r, deg) {
  const a = (deg - 90) * Math.PI / 180;
  return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
}

function renderWheel(prizes) {
  const svg = $("wheelSvg");
  const n = Math.max(prizes.length, 1);
  const seg = 360 / n;
  const cx = 200, cy = 200, R = 162;

  const defs = `
    <defs>
      <radialGradient id="rimGrad" cx="50%" cy="50%" r="50%">
        <stop offset="80%" stop-color="#5e3f16"/>
        <stop offset="92%" stop-color="#c9a25e"/>
        <stop offset="100%" stop-color="#2e1c08"/>
      </radialGradient>
      <radialGradient id="wheelShade" cx="42%" cy="32%" r="74%">
        <stop offset="0" stop-color="rgba(255,255,255,.18)"/>
        <stop offset="58%" stop-color="rgba(0,0,0,0)"/>
        <stop offset="100%" stop-color="rgba(0,0,0,.38)"/>
      </radialGradient>
    </defs>`;

  let segs = "";
  for (let i = 0; i < n; i++) {
    const a0 = i * seg, a1 = (i + 1) * seg;
    const [x0, y0] = polar(cx, cy, R, a0);
    const [x1, y1] = polar(cx, cy, R, a1);
    const large = seg > 180 ? 1 : 0;
    segs += `<path d="M${cx} ${cy} L${x0.toFixed(2)} ${y0.toFixed(2)} A${R} ${R} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z"
      fill="${SEG_FILL[i % SEG_FILL.length]}" stroke="rgba(0,0,0,.14)" stroke-width="1"/>`;
  }

  let icons = "";
  for (let i = 0; i < n; i++) {
    const mid = i * seg + seg / 2;
    const [ix, iy] = polar(cx, cy, R * 0.63, mid);
    const kind = iconByIndex(i);
    const size = Math.min(46, Math.max(30, 210 / n + 22));
    icons += `<g transform="translate(${ix.toFixed(2)} ${iy.toFixed(2)}) rotate(${mid.toFixed(2)}) translate(${-size / 2} ${-size / 2})">
      <svg width="${size}" height="${size}" viewBox="0 0 48 48" overflow="visible">${ICONS[kind]}</svg>
    </g>`;
  }

  let rim = "";
  const bulbs = 26;
  for (let i = 0; i < bulbs; i++) {
    const [bx, by] = polar(cx, cy, R + 14, (360 / bulbs) * i);
    rim += `<circle cx="${bx.toFixed(2)}" cy="${by.toFixed(2)}" r="10" fill="rgba(255,224,160,.40)" class="rim-bulb" style="animation-delay:${(i * 0.09).toFixed(2)}s"/>`;
    rim += `<circle cx="${bx.toFixed(2)}" cy="${by.toFixed(2)}" r="3.6" fill="#fff2cc" class="rim-bulb" style="animation-delay:${(i * 0.09).toFixed(2)}s"/>`;
  }

  svg.innerHTML = defs + `
    <circle cx="${cx}" cy="${cy}" r="${R + 26}" fill="url(#rimGrad)"/>
    <circle cx="${cx}" cy="${cy}" r="${R + 21}" fill="none" stroke="rgba(255,236,190,.90)" stroke-width="2"/>
    <g id="wheelSpin">
      <circle cx="${cx}" cy="${cy}" r="${R}" fill="#12291a"/>
      ${segs}
      ${icons}
      <circle cx="${cx}" cy="${cy}" r="${R}" fill="url(#wheelShade)" pointer-events="none"/>
    </g>
    ${rim}
  `;
}

function spinTo(index, n) {
  const seg = 360 / n;
  const center = index * seg + seg / 2;
  const base = state.wheelAngle - (state.wheelAngle % 360);
  const target = base + 360 * 5 + ((360 - center) % 360);
  state.wheelAngle = target;
  const el = document.getElementById("wheelSpin");
  if (!el) return;
  el.style.transition = "transform 4.6s cubic-bezier(.16,.86,.06,1)";
  el.style.transform = `rotate(${target}deg)`;
}

/* ================= РЕНДЕР ================= */
function renderAll() {
  const d = state.data;
  if (!d) return;

  const points = d.user ? d.user.points : 0;
  const cost = d.spin_cost || 100;

  $("helloTitle").textContent = `Привет, ${(d.user && d.user.name) || "друг"}! 💗`;
  const camp = d.campaign || {};
  $("helloText").textContent = camp.active
    ? "Кампания идёт: баллы начисляются за комментарии"
    : "Кампания сейчас не идёт: баллы пока не начисляются";

  $("pointsVal").textContent = points;
  $("spinCostTab").textContent = cost;

  const pct = Math.max(0, Math.min(100, Math.round((points / cost) * 100)));
  $("pointsBar").style.width = pct + "%";

  const left = Math.max(0, cost - points);
  $("pointsHint").innerHTML = left > 0
    ? `Ещё <b>${left}</b> ${plural(left, "балл", "балла", "баллов")}, и можно крутить колесо`
    : `Можно крутить колесо! Хватит на <b>${Math.floor(points / cost)}</b> ${plural(Math.floor(points / cost), "вращение", "вращения", "вращений")}`;

  const c = d.counts || {};
  $("cWeek").textContent = c.week || 0;
  $("cMonth").textContent = c.month || 0;
  $("cAll").textContent = c.all || 0;

  state.prizes = d.prizes || [];
  renderWheel(state.prizes);
  renderPrizes();
  renderTop();

  const btn = $("spinBtn");
  btn.textContent = `Крутить колесо — ${cost} ${plural(cost, "балл", "балла", "баллов")}`;
  btn.disabled = points < cost || state.spinning;

  if (d.daily_bonus > 0) {
    toast(`+${d.daily_bonus} ${plural(d.daily_bonus, "балл", "балла", "баллов")} за сегодняшний вход 🎁`);
  }
}

function renderPrizes() {
  const box = $("prizeList");
  const list = state.prizes;
  if (!list.length) { box.innerHTML = `<div class="empty">Призы пока не добавлены.</div>`; return; }
  box.innerHTML = list.map((p, i) => {
    const kind = iconByIndex(i);
    const name = stripEmoji(p.name) || "Приз";
    const detail = stripEmoji(p.detail);
    return `<div class="prize-row">
      <span class="prize-ico">${ICONS[kind]}</span>
      <span class="prize-name">${escapeHtml(name)}${detail ? ` — <em>${escapeHtml(detail)}</em>` : ""}
        ${p.stock > 0 ? `<span class="prize-stock"> · осталось ${p.stock}</span>` : ""}</span>
    </div>`;
  }).join("");
}

function renderTop() {
  const box = $("topList");
  const rows = (state.data && state.data.top && state.data.top[state.period]) || [];
  if (!rows.length) { box.innerHTML = `<div class="empty">Пока нет данных.</div>`; return; }
  const medal = ["🥇", "🥈", "🥉"];
  box.innerHTML = rows.map((r, i) => `
    <div class="top-row${r.me ? " me" : ""}">
      <span class="top-pos">${medal[i] || i + 1}</span>
      <span class="top-name">${escapeHtml(r.name)}</span>
      <span class="top-c">${r.count}</span>
    </div>`).join("");
}

function plural(n, one, few, many) {
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b > 1 && b < 5) return few;
  if (b === 1) return one;
  return many;
}

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
}

let toastTimer = null;
function toast(msg) {
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("on"), 3200);
}

function showModal(ico, title, text) {
  $("modalIco").textContent = ico;
  $("modalTitle").textContent = title;
  $("modalText").textContent = text;
  $("modal").classList.add("on");
}

async function load() {
  if (PREVIEW) {
    state.data = previewData();
    renderAll();
    return;
  }
  try {
    const d = await api("/api/me", { initData });
    if (d.error) { toast("Не удалось авторизоваться"); return; }
    state.data = d;
    renderAll();
  } catch (e) {
    toast("Не получилось загрузить данные");
  }
}

async function doSpin() {
  if (state.spinning) return;
  const d = state.data;
  if (!d) return;
  const cost = d.spin_cost || 100;
  if ((d.user.points || 0) < cost) { toast("Не хватает баллов"); return; }

  state.spinning = true;
  $("spinBtn").disabled = true;

  if (PREVIEW) {
    const n = Math.max(state.prizes.length, 1);
    const idx = Math.floor(Math.random() * n);
    spinTo(idx, n);
    setTimeout(() => {
      state.spinning = false;
      $("spinBtn").disabled = false;
      const p = state.prizes[idx];
      showModal("🎉", "Демо-режим", `Выпало: ${p ? stripEmoji(p.name) : "—"}. В Telegram здесь будет настоящий приз.`);
    }, 4800);
    return;
  }

  try {
    const r = await api("/api/spin", { initData });
    if (r.error) {
      state.spinning = false;
      $("spinBtn").disabled = false;
      toast(r.message || "Не удалось крутить");
      return;
    }
    const list = r.prizes || state.prizes;
    const n = Math.max(list.length, 1);
    const idx = Math.max(0, list.findIndex((p) => p.id === (r.prize && r.prize.id)));
    spinTo(idx, n);

    setTimeout(() => {
      state.spinning = false;
      if (r.points != null && state.data) state.data.user.points = r.points;
      if (r.prizes) state.prizes = r.prizes;
      renderAll();
      const name = stripEmoji(r.prize ? r.prize.name : "") || "Приз";
      const bonus = r.nothing_bonus ? ` Начислено +${r.nothing_bonus} баллов.` : "";
      showModal("🎉", "Поздравляем!", `Вам выпало: ${name}.${bonus} Остаток баллов: ${r.points}.`);
    }, 4800);
  } catch (e) {
    state.spinning = false;
    $("spinBtn").disabled = false;
    toast("Ошибка сети, попробуйте ещё раз");
  }
}

$("spinBtn").addEventListener("click", doSpin);
$("hub").addEventListener("click", doSpin);
$("modalClose").addEventListener("click", () => $("modal").classList.remove("on"));
$("modal").addEventListener("click", (e) => { if (e.target.id === "modal") $("modal").classList.remove("on"); });

$("btnClose").addEventListener("click", () => { if (tg && tg.close) tg.close(); else history.back(); });
$("btnMore").addEventListener("click", () => {
  if (tg && tg.showPopup) {
    tg.showPopup({
      title: "Full Bak Points",
      message: "Пишите комментарии под постами — получайте баллы и крутите колесо призов.",
      buttons: [{ type: "close" }],
    });
  } else {
    toast("Пишите комментарии — получайте баллы 🎁");
  }
});

document.querySelectorAll(".tab").forEach((tab) => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach((t) => t.classList.remove("on"));
    tab.classList.add("on");
    state.period = tab.dataset.period;
    renderTop();
  });
});

buildTree();
buildBottom();
startSnow();
load();
</script>
