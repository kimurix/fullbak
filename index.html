<style>
:root{--gold:#E8C98A;--cream:#F7ECD8;--pink:#FF5C8A;--line:rgba(232,201,138,.55);

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:#16261A;color:var(--cream);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
overscroll-behavior:none;-webkit-font-smoothing:antialiased}
#bg{position:fixed;inset:0;z-index:0;background:#16261A url('bg.png') center top/cover no-repeat}
#bg::after{content:"";position:absolute;inset:0;pointer-events:none;

#snow{position:fixed;inset:0;z-index:1;width:100%;height:100%;pointer-events:none}
#app{position:fixed;inset:0;z-index:2;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;

scrollbar-width:none}
#app::-webkit-scrollbar{display:none}
.wrap{max-width:440px;margin:0 auto}
.sb{max-width:440px;margin:0 auto 6px;display:flex;align-items:center;justify-content:space-between;
padding:0 12px;height:26px;color:#fff;font-size:15px;font-weight:600}

.ib{width:48px;height:48px;flex:0 0 48px;border-radius:50%;border:1px solid rgba(255,255,255,.6);

.card{border-radius:26px;border:1.5px solid var(--line);background:var(--glass);

.points{position:relative;margin-top:34px;padding:16px}
.ptabs{position:absolute;top:-32px;left:0;right:0;display:flex;gap:8px}
.ptab{border:1.5px solid var(--line);border-radius:18px;

.ctitle{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:#fff;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{border-radius:18px;border:1.5px solid rgba(232,201,138,.45);

.stat span{display:block;font-size:10.5px;color:rgba(247,236,216,.72);margin-top:3px}
.rwrap{display:flex;justify-content:center;margin:22px 0 12px}
.ribbon{position:relative;display:flex;align-items:center;justify-content:center;gap:14px;

.ribbon::before{left:-19px;clip-path:polygon(100% 0,0 50%,100% 100%)}
.ribbon::after{right:-19px;clip-path:polygon(0 0,100% 50%,0 100%)}

.wbox{position:relative;width:min(96vw,410px);margin:0 auto 6px;aspect-ratio:1/1}

#spin{transform-origin:50% 50%;transform:rotate(0);will-change:transform}
.hub{position:absolute;left:50%;top:50%;width:19%;height:19%;transform:translate(-50%,-50%);

.hub:active{transform:translate(-50%,-50%) scale(.94)}

.bonus{position:fixed;left:0;right:0;z-index:4;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
padding:0 14px;display:flex;justify-content:center}
.bbtn{width:100%;max-width:440px;display:flex;align-items:center;gap:12px;padding:15px 20px;

color:var(--cream);font-size:15px;font-weight:600;cursor:pointer}
.bbtn .t{flex:1 1 auto;text-align:left}
.bbtn svg{flex:0 0 auto}
.prow{display:flex;align-items:center;gap:10px;padding:9px 0;
border-bottom:1px solid rgba(232,201,138,.15);font-size:13.5px}
.prow:last-child{border-bottom:none}
.pico{flex:0 0 28px;width:28px;height:28px}
.pico svg{width:100%;height:100%}
.pname{flex:1 1 auto;min-width:0;line-height:1.35}
.pname em{font-style:normal;color:rgba(247,236,216,.65)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{flex:1;padding:9px 4px;border-radius:12px;border:1.5px solid rgba(232,201,138,.35);
background:rgba(255,255,255,.05);color:rgba(247,236,216,.7);font-size:12.5px;cursor:pointer}
.tab.on{background:rgba(232,201,138,.2);border-color:rgba(232,201,138,.75);color:#fff}
.trow{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:13.5px;
border-bottom:1px solid rgba(232,201,138,.12)}
.trow:last-child{border-bottom:none}
.trow.me{color:var(--gold)}
.tpos{flex:0 0 24px;text-align:center;font-weight:700;color:rgba(247,236,216,.6)}
.tname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{font-size:13px;color:rgba(247,236,216,.6);padding:6px 0}
.modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
padding:24px;background:rgba(4,14,8,.75);backdrop-filter:blur(6px)}
.modal.on{display:flex}
.mcard{width:100%;max-width:330px;border-radius:26px;border:1.5px solid rgba(232,201,138,.7);
background:linear-gradient(180deg,rgba(26,56,36,.99),rgba(12,32,20,.99));
box-shadow:0 24px 60px rgba(0,0,0,.7);padding:26px 20px;text-align:center;
animation:pop .35s cubic-bezier(.2,1.2,.4,1)}
@keyframes pop{from{transform:scale(.86);opacity:0}to{transform:scale(1);opacity:1}}
.mcard .big{font-size:52px;line-height:1;margin-bottom:10px}
.mcard h3{margin:0 0 6px;font-family:Georgia,serif;font-size:20px;color:#fff}
.mcard p{margin:0 0 18px;font-size:13.5px;color:rgba(247,236,216,.75);line-height:1.45}
.mcard button{width:100%;padding:14px;border-radius:16px;border:1.5px solid rgba(232,201,138,.7);
background:linear-gradient(180deg,#C03328,#7A1515);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);
transform:translate(-50%,20px);z-index:30;padding:12px 18px;border-radius:16px;
background:rgba(18,44,28,.97);border:1.5px solid rgba(232,201,138,.6);color:var(--cream);
font-size:13.5px;box-shadow:0 12px 30px rgba(0,0,0,.6);opacity:0;pointer-events:none;
transition:opacity .25s,transform .25s;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.bulb{animation:bt 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bt{0%,100%{opacity:.55}45%{opacity:1}62%{opacity:.85}}
</style>
</head>

star:`<svg viewBox="0 0 48 48"><defs><linearGradient id="is" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE9A8"/><stop offset="1" stop-color="#D9A62E"/></linearGradient></defs><path d="M24 6l5.3 11.6 12.7 1.5-9.4 8.6 2.6 12.5L24 34.3 12.8 40.2l2.6-12.5L6 19.1l12.7-1.5z" fill="url(#is)" stroke="#B8860B" stroke-width="1.2" stroke-linejoin="round"/></svg>`,

ball:`<svg viewBox="0 0 48 48"><defs><radialGradient id="ib" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#FF8A80"/><stop offset="45%" stop-color="#C62828"/><stop offset="100%" stop-color="#6D0F0F"/></radialGradient></defs><rect x="21" y="8" width="6" height="5" rx="1.5" fill="#E8C98A"/><circle cx="24" cy="27" r="13" fill="url(#ib)"/><ellipse cx="19" cy="22" rx="4" ry="2.8" fill="rgba(255,255,255,.55)" transform="rotate(-30 19 22)"/></svg>`,

bell:`<svg viewBox="0 0 48 48"><defs><linearGradient id="il" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE9A8"/><stop offset="1" stop-color="#D99B1F"/></linearGradient></defs><path d="M24 11a9 9 0 0 0-9 9v7l-3.2 5.2h24.4L33 27v-7a9 9 0 0 0-9-9z" fill="url(#il)" stroke="#A8761A" stroke-width="1.1"/><circle cx="24" cy="36" r="3.2" fill="#C98F1C"/><rect x="22" y="6" width="4" height="4.5" rx="2" fill="#C98F1C"/></svg>`};

const ORDER=["gift","candy","snow","star","tree","ball","heart","bell"];
const SEGF=["#F7ECD8","#8F1D1D","#F7ECD8","#1F4A2E"];

function polar(cx,cy,r,d){const a=(d-90)*Math.PI/180;return[cx+r*Math.cos(a),cy+r*Math.sin(a)]}

function renderWheel(prizes){
  const n=Math.max(prizes.length,1),seg=360/n,cx=200,cy=200,R=150;
  let defs=`<defs>
  <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#F7E3B8"/><stop offset=".35" stop-color="#C9A25E"/>
  <stop offset=".6" stop-color="#F7E3B8"/><stop offset="1" stop-color="#9C7434"/></linearGradient>
  <radialGradient id="bg1"><stop offset="0" stop-color="#FFE9A8" stop-opacity="1"/>
  <stop offset="1" stop-color="#FFC46B" stop-opacity="0"/></radialGradient></defs>`;
  let segs="";
  for(let i=0;i<n;i++){
    const a0=i*seg,a1=(i+1)*seg;
    const[x0,y0]=polar(cx,cy,R,a0),[x1,y1]=polar(cx,cy,R,a1);
    segs+=`<path d="M${cx} ${cy} L${x0.toFixed(1)} ${y0.toFixed(1)} A${R} ${R} 0 ${seg>180?1:0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)} Z" fill="${SEGF[i%4]}" stroke="rgba(0,0,0,.18)" stroke-width="1"/>`;
  }
  let icons="";
  for(let i=0;i<n;i++){
    const mid=i*seg+seg/2,[ix,iy]=polar(cx,cy,R*.64,mid);
    const k=ORDER[i%ORDER.length],sz=Math.min(46,Math.max(30,200/n+20));
    icons+=`<g transform="translate(${ix.toFixed(1)} ${iy.toFixed(1)}) rotate(${mid.toFixed(1)}) translate(${-sz/2} ${-sz/2})"><svg width="${sz}" height="${sz}" viewBox="0 0 48 48">${ICO[k]}</svg></g>`;
  }
  let bulbs="";
  const NB=26;
  for(let i=0;i<NB;i++){
    const[bx,by]=polar(cx,cy,R+22,(360/NB)*i);
    bulbs+=`<circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="13" fill="url(#bg1)" class="bulb" style="animation-delay:${(i*.12).toFixed(2)}s"/>
    <circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="5" fill="#FFF3C4" class="bulb" style="animation-delay:${(i*.12).toFixed(2)}s"/>`;
  }
  $("wheel").innerHTML=defs+`
  <circle cx="${cx}" cy="${cy}" r="${R+34}" fill="url(#rim)"/>
  <circle cx="${cx}" cy="${cy}" r="${R+30}" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/>
  <circle cx="${cx}" cy="${cy}" r="${R+8}" fill="#0E2416"/>
  <g id="spin"><circle cx="${cx}" cy="${cy}" r="${R}" fill="#0E2416"/>${segs}${icons}</g>
  ${bulbs}`;
}

function spinTo(idx,n){
  const seg=360/n,center=idx*seg+seg/2;
  const base=S.angle-(S.angle%360);
  const target=base+360*5+((360-center)%360);
  S.angle=target;
  const el=$("spin");
  if(!el)return;
  el.style.transition="transform 4.6s cubic-bezier(.16,.86,.06,1)";
  el.style.transform=`rotate(${target}deg)`;
}

function plural(n,a,b,c){const x=Math.abs(n)%100,y=x%10;if(x>10&&x<20)return c;if(y>1&&y<5)return b;if(y===1)return a;return c}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

function renderAll(){
  const d=S.data;if(!d)return;
  const pts=d.user?d.user.points:0,cost=d.spin_cost||100;
  $("helloTitle").textContent=`Привет, ${(d.user&&d.user.name)||"друг"}! 💗`;
  $("helloText").textContent=d.campaign&&d.campaign.active
    ?"Кампания идёт: баллы начисляются за комментарии"
    :"Кампания сейчас не идёт: баллы пока не начисляются";
  $("pointsVal").textContent=pts;
  $("spinCost").textContent=cost;
  $("pointsBar").style.width=Math.max(0,Math.min(100,Math.round(pts/cost*100)))+"%";
  const left=Math.max(0,cost-pts);
  $("pointsHint").innerHTML=left>0
    ?`Ещё <b>${left}</b> ${plural(left,"балл","балла","баллов")}, и можно крутить колесо`
    :`Можно крутить! Хватит на <b>${Math.floor(pts/cost)}</b> ${plural(Math.floor(pts/cost),"вращение","вращения","вращений")}`;
  const c=d.counts||{};
  $("cWeek").textContent=c.week||0;$("cMonth").textContent=c.month||0;$("cAll").textContent=c.all||0;
  S.prizes=d.prizes||[];
  renderWheel(S.prizes);renderPrizes();renderTop();
  if(d.daily_bonus>0)toast(`+${d.daily_bonus} ${plural(d.daily_bonus,"балл","балла","баллов")} за вход 🎁`);
}

function renderPrizes(){
  const box=$("prizeList"),l=S.prizes;
  if(!l.length){box.innerHTML='<div class="empty">Призы пока не добавлены.</div>';return}
  box.innerHTML=l.map((p,i)=>{
    const k=ORDER[i%ORDER.length];
    return `<div class="prow"><span class="pico">${ICO[k]}</span>
    <span class="pname">${esc(p.name)}${p.detail?` — <em>${esc(p.detail)}</em>`:""}${p.stock>0?` <em>· осталось ${p.stock}</em>`:""}</span></div>`;
  }).join("");
}

function renderTop(){
  const box=$("topList");
  const rows=(S.data&&S.data.top&&S.data.top[S.period])||[];
  if(!rows.length){box.innerHTML='<div class="empty">Пока нет данных.</div>';return}
  const m=["🥇","🥈","🥉"];
  box.innerHTML=rows.map((r,i)=>`<div class="trow${r.me?" me":""}"><span class="tpos">${m[i]||i+1}</span>
  <span class="tname">${esc(r.name)}</span><span>${r.count}</span></div>`).join("");
}

let tt=null;
function toast(m){const e=$("toast");e.textContent=m;e.classList.add("on");
clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),3200)}

function showModal(ico,t,x){$("mIco").textContent=ico;$("mTitle").textContent=t;$("mText").textContent=x;$("modal").classList.add("on")}

async function load(){
  if(PREVIEW){S.data=demo();renderAll();return}
  try{const d=await api("/api/me",{initData});
    if(d.error){toast("Не удалось авторизоваться");return}
    S.data=d;renderAll();
  }catch(e){toast("Не получилось загрузить данные")}
}

async function doSpin(){
  if(S.spinning)return;
  const d=S.data;if(!d)return;
  const cost=d.spin_cost||100;
  if((d.user.points||0)<cost){toast("Не хватает баллов");return}
  S.spinning=true;
  if(PREVIEW){
    const n=Math.max(S.prizes.length,1),idx=Math.floor(Math.random()*n);
    spinTo(idx,n);
    setTimeout(()=>{S.spinning=false;const p=S.prizes[idx];
      showModal("🎉","Демо-режим",`Выпало: ${p?p.name:"—"}. В Telegram здесь будет настоящий приз.`)},4800);
    return;
  }
  try{
    const r=await api("/api/spin",{initData});
    if(r.error){S.spinning=false;toast(r.message||"Не удалось крутить");return}
    const list=r.prizes||S.prizes,n=Math.max(list.length,1);
    const idx=Math.max(0,list.findIndex(p=>p.id===(r.prize&&r.prize.id)));
    spinTo(idx,n);
    setTimeout(()=>{
      S.spinning=false;
      if(r.points!=null&&S.data)S.data.user.points=r.points;
      if(r.prizes)S.prizes=r.prizes;
      renderAll();
      const bonus=r.nothing_bonus?` Начислено +${r.nothing_bonus} баллов.`:"";
      showModal("🎉","Поздравляем!",`Вам выпало: ${r.prize?r.prize.name:"—"}.${bonus} Остаток: ${r.points}.`);
    },4800);
  }catch(e){S.spinning=false;toast("Ошибка сети, попробуйте ещё раз")}
}

function snow(){
  const cv=$("snow"),ctx=cv.getContext("2d");
  let W=0,H=0,dpr=Math.min(devicePixelRatio||1,2),fl=[],gl=[];
  function rs(){
    W=cv.clientWidth;H=cv.clientHeight;
    cv.width=W*dpr|0;cv.height=H*dpr|0;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.min(Math.max(Math.round(W*H/16000),35),110);
    fl=Array.from({length:n},()=>nf(true));
    gl=Array.from({length:26},()=>ng(true));
  }
  function nf(i){return{x:Math.random()*W,y:i?Math.random()*H:-10,r:.7+Math.random()*2,
    vy:.18+Math.random()*.5,vx:(Math.random()-.5)*.2,ph:Math.random()*6.28,sp:.4+Math.random()*.9,a:.3+Math.random()*.5}}
  function ng(i){return{x:Math.random()*W,y:i?Math.random()*H:-10,r:.6+Math.random()*1.3,
    vy:.1+Math.random()*.3,vx:(Math.random()-.5)*.3,ph:Math.random()*6.28,sp:1.4+Math.random()*2}}
  let t=0;
  function f(){
    t+=.016;ctx.clearRect(0,0,W,H);
    for(const p of fl){
      p.y+=p.vy;p.x+=p.vx+Math.sin(t*p.sp+p.ph)*.26;
      if(p.y>H+8)Object.assign(p,nf(false));
      if(p.x<-8)p.x=W+8;if(p.x>W+8)p.x=-8;
      const tw=.72+.28*Math.sin(t*p.sp*1.7+p.ph);
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);
      ctx.fillStyle=`rgba(255,252,245,${(p.a*tw).toFixed(3)})`;ctx.fill();
    }
    for(const g of gl){
      g.y+=g.vy;g.x+=g.vx+Math.sin(t*.7+g.ph)*.16;
      if(g.y>H+8)Object.assign(g,ng(false));
      if(g.x<-8)g.x=W+8;if(g.x>W+8)g.x=-8;
      const k=Math.max(0,Math.sin(t*g.sp+g.ph));
      if(k<.05)continue;
      const r=g.r*(.6+k*1.5);
      const gr=ctx.createRadialGradient(g.x,g.y,0,g.x,g.y,r*4);
      gr.addColorStop(0,`rgba(255,235,180,${(.85*k).toFixed(3)})`);
      gr.addColorStop(1,"rgba(255,220,150,0)");
      ctx.fillStyle=gr;ctx.beginPath();ctx.arc(g.x,g.y,r*4,0,6.283);ctx.fill();
    }
    requestAnimationFrame(f);
  }
  rs();addEventListener("resize",rs);requestAnimationFrame(f);
}

$("hub").addEventListener("click",doSpin);
$("mClose").addEventListener("click",()=>$("modal").classList.remove("on"));
$("modal").addEventListener("click",e=>{if(e.target.id==="modal")$("modal").classList.remove("on")});
$("bClose").addEventListener("click",()=>{if(tg&&tg.close)tg.close();else history.back()});
$("bMore").addEventListener("click",()=>{
  if(tg&&tg.showPopup)tg.showPopup({title:"Full Bak Points",
    message:"Пишите комментарии под постами — получайте баллы и крутите колесо призов.",
    buttons:[{type:"close"}]});
  else toast("Пишите комментарии — получайте баллы 🎁");
});
$("bonusBtn").addEventListener("click",()=>{
  if(tg&&tg.showPopup)tg.showPopup({title:"Бонус к балансу",
    message:"Бонус +50 баллов начисляется за активность. Пишите комментарии под постами!",
    buttons:[{type:"close"}]});
  else toast("Бонус +50 баллов за активность 🎁");
});
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
  t.classList.add("on");S.period=t.dataset.p;renderTop();
}));

snow();load();
</script>
