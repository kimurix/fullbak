<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#16261A">
<title>Full Bak Points</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--gold:#E8C98A;--cream:#F7ECD8;--line:rgba(232,201,138,.45);
--glass:linear-gradient(180deg,rgba(20,46,28,.52),rgba(10,28,16,.62))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:#16261A;color:var(--cream);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
overscroll-behavior:none;-webkit-font-smoothing:antialiased}
#bg{position:fixed;inset:0;z-index:0;background:#16261A url('bg.png') center top/cover no-repeat}
#bg::after{content:"";position:absolute;inset:0;pointer-events:none;
background:radial-gradient(95% 70% at 50% 40%,rgba(0,0,0,0) 50%,rgba(0,0,0,.35) 100%)}
#snow{position:fixed;inset:0;z-index:1;width:100%;height:100%;pointer-events:none}
#app{position:fixed;inset:0;z-index:2;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
padding:calc(env(safe-area-inset-top,0px) + 18px) 14px calc(env(safe-area-inset-bottom,0px) + 40px);
scrollbar-width:none}
#app::-webkit-scrollbar{display:none}
.wrap{max-width:430px;margin:0 auto}
.card{border-radius:24px;border:1.5px solid var(--line);background:var(--glass);
backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
box-shadow:0 14px 34px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08);
padding:16px;margin-bottom:13px}
.hello{background:linear-gradient(160deg,#9E2118 0%,#7A1512 45%,#4E0C0C 100%);
border-color:rgba(232,201,138,.55);box-shadow:0 16px 38px rgba(40,3,3,.65),inset 0 1px 0 rgba(255,255,255,.16);
position:relative;overflow:hidden;padding:18px}
.hello::before{content:"";position:absolute;inset:0;pointer-events:none;
background:radial-gradient(110% 90% at 85% -25%,rgba(255,255,255,.14),rgba(255,255,255,0) 60%)}
.hello h1{margin:0 0 9px;font-family:Georgia,"Times New Roman",serif;font-size:24px;font-weight:600;
line-height:1.2;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.45);position:relative}
.hello p{margin:0;font-size:13px;line-height:1.5;color:rgba(255,246,238,.94);max-width:72%;position:relative}
.hello .holly{position:absolute;right:14px;top:50%;transform:translateY(-50%);pointer-events:none}
.points{padding:16px}
.phead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.phead span{font-size:13px;color:rgba(247,236,216,.82)}
.phead b{color:var(--cream);font-weight:600}
.pval{font-size:46px;font-weight:700;line-height:1;color:#fff;
text-shadow:0 4px 20px rgba(0,0,0,.55);margin-bottom:12px}
.pmid{display:flex;align-items:center;gap:10px}
.bar{flex:1 1 auto;height:16px;border-radius:99px;
background:linear-gradient(180deg,rgba(8,20,12,.8),rgba(20,40,26,.8));
border:1.5px solid rgba(232,201,138,.5);overflow:hidden;box-shadow:inset 0 2px 8px rgba(0,0,0,.6)}
.bar>i{display:block;height:100%;width:0;border-radius:99px;
background:linear-gradient(90deg,#E8C98A,#FFF0C4 55%,#E8C98A);
box-shadow:0 0 20px rgba(232,201,138,.9);transition:width .8s cubic-bezier(.2,.9,.2,1)}
.phint{margin-top:13px;padding-top:11px;border-top:1px solid rgba(232,201,138,.18);
font-size:12.5px;color:rgba(247,236,216,.72);text-align:center}
.phint b{color:var(--cream)}
.ctitle{font-size:15px;font-weight:600;color:#fff;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{position:relative;border-radius:16px;border:1.5px solid rgba(232,201,138,.38);
background:linear-gradient(180deg,rgba(28,58,36,.55),rgba(14,36,22,.55));
padding:22px 5px 11px;text-align:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
.stat .bow{position:absolute;top:-12px;left:50%;transform:translateX(-50%);width:38px;height:24px}
.stat b{display:block;font-size:25px;font-weight:700;line-height:1.1;color:#fff}
.stat span{display:block;font-size:10.5px;color:rgba(247,236,216,.7);margin-top:3px}
.rwrap{display:flex;justify-content:center;margin:20px 0 12px}
.ribbon{position:relative;display:flex;align-items:center;justify-content:center;gap:14px;
padding:12px 34px;font-family:Georgia,"Times New Roman",serif;font-size:19px;color:#FFEECB;
background:linear-gradient(180deg,#B92E22,#6E1212);border:2px solid rgba(232,201,138,.95);
border-radius:14px;box-shadow:0 16px 34px rgba(0,0,0,.6),
inset 0 0 0 3px rgba(232,201,138,.22),inset 0 1px 0 rgba(255,255,255,.2)}
.ribbon svg{width:22px;height:22px;flex:0 0 auto}
.wbox{position:relative;width:min(88vw,370px);margin:0 auto 6px;aspect-ratio:1/1}
#wheel{width:100%;height:100%;display:block}
#spin{transform-origin:50% 50%;transform:rotate(0);will-change:transform}
.hub{position:absolute;left:50%;top:50%;width:19%;height:19%;transform:translate(-50%,-50%);
border-radius:50%;border:none;padding:0;
background:radial-gradient(circle at 36% 30%,#D8452F 0%,#B32222 55%,#7A1515 100%);
box-shadow:0 0 0 4px rgba(232,201,138,.95),0 0 30px rgba(232,201,138,.55),0 12px 30px rgba(0,0,0,.7);
display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s}
.hub:active{transform:translate(-50%,-50%) scale(.94)}
.hub svg{width:56%;height:56%}
.bonus{position:fixed;left:0;right:0;z-index:4;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
padding:0 14px;display:none;justify-content:center}
.bbtn{width:100%;max-width:430px;display:flex;align-items:center;gap:12px;padding:15px 20px;
border-radius:22px;border:1.5px solid rgba(232,201,138,.85);
background:linear-gradient(180deg,rgba(24,54,34,.94),rgba(12,34,20,.94));
backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
box-shadow:0 16px 36px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.12);
color:var(--cream);font-size:15px;font-weight:600;cursor:pointer}
.bbtn .t{flex:1 1 auto;text-align:left}
.prow{display:flex;align-items:center;gap:10px;padding:9px 0;
border-bottom:1px solid rgba(232,201,138,.13);font-size:13.5px}
.prow:last-child{border-bottom:none}
.pico{flex:0 0 28px;width:28px;height:28px}
.pico svg{width:100%;height:100%}
.pname{flex:1 1 auto;min-width:0;line-height:1.35}
.pname em{font-style:normal;color:rgba(247,236,216,.62)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{flex:1;padding:9px 4px;border-radius:12px;border:1.5px solid rgba(232,201,138,.3);
background:rgba(255,255,255,.04);color:rgba(247,236,216,.65);font-size:12.5px;cursor:pointer}
.tab.on{background:rgba(232,201,138,.18);border-color:rgba(232,201,138,.7);color:#fff}
.trow{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:13.5px;
border-bottom:1px solid rgba(232,201,138,.1)}
.trow:last-child{border-bottom:none}
.trow.me{color:var(--gold)}
.tpos{flex:0 0 26px;display:flex;align-items:center;justify-content:center}
.tpos svg{width:24px;height:24px}
.tpos .num{font-weight:700;color:rgba(247,236,216,.55);font-size:13px}
.tname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcount{font-weight:600}
.thint{margin-top:10px;padding-top:10px;border-top:1px solid rgba(232,201,138,.15);
font-size:11.5px;color:rgba(247,236,216,.55);text-align:center}
.empty{font-size:13px;color:rgba(247,236,216,.55);padding:6px 0}
.modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
padding:24px;background:rgba(4,14,8,.75);backdrop-filter:blur(6px)}
.modal.on{display:flex}
.mcard{width:100%;max-width:320px;border-radius:24px;border:1.5px solid rgba(232,201,138,.7);
background:linear-gradient(180deg,rgba(24,54,34,.99),rgba(10,30,18,.99));
box-shadow:0 24px 60px rgba(0,0,0,.7);padding:24px 20px;text-align:center;
animation:pop .35s cubic-bezier(.2,1.2,.4,1)}
@keyframes pop{from{transform:scale(.86);opacity:0}to{transform:scale(1);opacity:1}}
.mcard .big{font-size:50px;line-height:1;margin-bottom:10px}
.mcard h3{margin:0 0 6px;font-family:Georgia,serif;font-size:20px;color:#fff}
.mcard p{margin:0 0 18px;font-size:13.5px;color:rgba(247,236,216,.72);line-height:1.45}
.mcard button{width:100%;padding:14px;border-radius:14px;border:1.5px solid rgba(232,201,138,.7);
background:linear-gradient(180deg,#B92E22,#6E1212);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);
transform:translate(-50%,20px);z-index:30;padding:12px 18px;border-radius:14px;
background:rgba(16,40,24,.97);border:1.5px solid rgba(232,201,138,.55);color:var(--cream);
font-size:13.5px;box-shadow:0 12px 30px rgba(0,0,0,.55);opacity:0;pointer-events:none;
transition:opacity .25s,transform .25s;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="snow"></canvas>

<div id="app"><div class="wrap">

  <div class="card hello">

<script>
const API="https://tg-activity-bot.katka-69.workers.dev";
const tg=window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null;
if(tg){try{tg.ready();tg.expand();tg.setHeaderColor&&tg.setHeaderColor("#16261A");tg.setBackgroundColor&&tg.setBackgroundColor("#16261A")}catch(e){}}
const initData=tg&&tg.initData?tg.initData:"";
const PREVIEW=!initData;
const $=id=>document.getElementById(id);
const state={data:null,period:"week",spinning:false,angle:0,prizes:[]};

async function api(p,b){
  const r=await fetch(API+p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})});
  return r.json();
}
function previewData(){return{
  user:{id:1,name:"@pln_bak",points:0},daily_bonus:50,
  counts:{week:0,month:0,all:0},spin_cost:100,
  campaign:{active:false},
  top:{week:[{name:"@MaksimPeComic",count:2,me:false},{name:"@diogen86",count:2,me:false},
  {name:"@neopasha",count:1,me:false},{name:"Александр",count:1,me:false},{name:"@Erid2025",count:1,me:false}],
  month:[],all:[]},
  prizes:[
    {id:1,name:"Подарок",chance:20,stock:5,detail:"Промокод на 10% на любой заказ"},
    {id:2,name:"Леденец",chance:15,stock:-1,detail:"Скидка 500 ₽ на следующий заказ"},
    {id:3,name:"Снежинка",chance:15,stock:-1,detail:"Подписка +1 неделя"},
    {id:4,name:"Звезда",chance:10,stock:3,detail:"Эксклюзивный доступ"},
    {id:5,name:"Ёлочка",chance:10,stock:-1,detail:"Кружок с пожеланием"},
    {id:6,name:"Ёлочный шар",chance:10,stock:-1,detail:"Кастомный дизайн под запрос"},
    {id:7,name:"Колокольчик",chance:10,stock:-1,detail:"Выбор образа на иллюстрацию"},
    {id:8,name:"Сердце",chance:10,stock:-1,detail:"Утешительный бонус — 50 баллов"}
  ]};}

/* ---------- иконки ---------- */
const ICONS={
gift:`<svg viewBox="0 0 48 48"><defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D8452F"/><stop offset="1" stop-color="#7A1515"/></linearGradient></defs>
<rect x="10" y="20" width="28" height="20" rx="3" fill="url(#g1)"/><rect x="10" y="20" width="28" height="5.5" rx="2.5" fill="#E8C98A"/>
<rect x="21.5" y="20" width="5" height="20" fill="#F2D79C"/>
<path d="M24 20c-6 0-10-2.8-10-5.8S19.5 11 24 20c4.5-9 10-8.6 10-5.8S30 20 24 20z" fill="#F2D79C"/></svg>`,
candy:`<svg viewBox="0 0 48 48"><defs><mask id="cm"><path d="M17 41V20a7 7 0 0 1 14 0v5" stroke="#fff" stroke-width="9" fill="none" stroke-linecap="round"/></mask></defs>
<g mask="url(#cm)"><rect x="8" y="2" width="34" height="46" fill="#F7ECD8"/>
<rect x="8" y="8" width="34" height="5" fill="#C62828"/><rect x="8" y="18" width="34" height="5" fill="#C62828"/>
<rect x="8" y="28" width="34" height="5" fill="#C62828"/><rect x="8" y="38" width="34" height="5" fill="#C62828"/></g></svg>`,
snow:`<svg viewBox="0 0 48 48" fill="none" stroke="#EAF4FF" stroke-width="2.6" stroke-linecap="round">
<path d="M24 7v34M9 15.5l30 17M39 15.5l-30 17"/><path d="M24 12l-4 4M24 12l4 4M24 36l-4-4M24 36l4-4"/></svg>`,
star:`<svg viewBox="0 0 48 48"><defs><linearGradient id="s1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE08A"/><stop offset="1" stop-color="#D99B1F"/></linearGradient></defs>
<path d="M24 6l5.3 11.6 12.7 1.5-9.4 8.6 2.6 12.5L24 34.3 12.8 40.2l2.6-12.5L6 19.1l12.7-1.5z" fill="url(#s1)" stroke="#A8761A" stroke-width="1.2" stroke-linejoin="round"/></svg>`,
tree:`<svg viewBox="0 0 48 48"><defs><linearGradient id="t1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3E8C4A"/><stop offset="1" stop-color="#14401F"/></linearGradient></defs>
<rect x="21" y="36" width="6" height="6" rx="1.5" fill="#6B4A2A"/>
<path d="M24 5l8 11h-4.5l7 10h-5l7.5 11H11l7.5-11h-5l7-10H16z" fill="url(#t1)" stroke="#0D3A22" stroke-width="1"/>
<circle cx="24" cy="12" r="1.8" fill="#F2D79C"/><circle cx="19" cy="24" r="1.6" fill="#E04B3A"/><circle cx="29" cy="26" r="1.6" fill="#F2D79C"/></svg>`,
ball:`<svg viewBox="0 0 48 48"><defs><radialGradient id="b1" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#FF8A80"/><stop offset="45%" stop-color="#C62828"/><stop offset="100%" stop-color="#5E0F0F"/></radialGradient></defs>
<rect x="21" y="8" width="6" height="5" rx="1.5" fill="#E8C98A"/><circle cx="24" cy="27" r="13" fill="url(#b1)"/>
<ellipse cx="19" cy="22" rx="4" ry="2.8" fill="rgba(255,255,255,.5)" transform="rotate(-30 19 22)"/></svg>`,
bell:`<svg viewBox="0 0 48 48"><defs><linearGradient id="bl1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE08A"/><stop offset="1" stop-color="#C98F1C"/></linearGradient></defs>
<path d="M24 11a9 9 0 0 0-9 9v7l-3.2 5.2h24.4L33 27v-7a9 9 0 0 0-9-9z" fill="url(#bl1)" stroke="#A8761A" stroke-width="1.1"/>
<circle cx="24" cy="36" r="3.2" fill="#C98F1C"/><rect x="22" y="6" width="4" height="4.5" rx="2" fill="#C98F1C"/></svg>`,
heart:`<svg viewBox="0 0 48 48"><defs><linearGradient id="h1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF7A7A"/><stop offset="1" stop-color="#B32222"/></linearGradient></defs>
<path d="M24 41s-13-8.2-13-17.2A7.8 7.8 0 0 1 24 18a7.8 7.8 0 0 1 13 5.8C37 32.8 24 41 24 41z" fill="url(#h1)"/>
<ellipse cx="18" cy="22" rx="3.4" ry="2.4" fill="rgba(255,255,255,.45)" transform="rotate(-25 18 22)"/></svg>`
};
const ORDER=["gift","candy","snow","star","tree","ball","bell","heart"];
const iconAt=i=>ICONS[ORDER[i%ORDER.length]];

/* ---------- медали ---------- */
function medal(n){
  const c=n===1?["#FFE08A","#C98F1C"]:n===2?["#E6ECF2","#9AA9B8"]:["#F0B27A","#A85B22"];
  return `<svg viewBox="0 0 48 48"><defs><linearGradient id="md${n}" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="${c[0]}"/><stop offset="1" stop-color="${c[1]}"/></linearGradient></defs>
  <path d="M15 4l9 12-9 4-6-12z" fill="#8E1A16"/><path d="M33 4l-9 12 9 4 6-12z" fill="#8E1A16"/>
  <circle cx="24" cy="29" r="13" fill="url(#md${n})" stroke="rgba(0,0,0,.25)" stroke-width="1.2"/>
  <circle cx="24" cy="29" r="8.5" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="1.4"/>
  <text x="24" y="34" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="rgba(70,40,0,.7)">${n}</text></svg>`;
}

/* ---------- колесо ---------- */
const SEG=["#F7ECD8","#8E1A16","#F7ECD8","#1B4A2E"];
function polar(cx,cy,r,d){const a=(d-90)*Math.PI/180;return[cx+r*Math.cos(a),cy+r*Math.sin(a)]}

function renderWheel(list){
  const svg=$("wheel"),n=Math.max(list.length,1),seg=360/n,cx=200,cy=200,R=152;
  let defs=`<defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6B4F1C"/><stop offset="30%" stop-color="#B8912F"/>
      <stop offset="55%" stop-color="#7A5A20"/><stop offset="100%" stop-color="#4A3510"/></linearGradient>
    <radialGradient id="bulbG"><stop offset="0" stop-color="#FFF6D6"/><stop offset="45%" stop-color="#FFD98A" stop-opacity=".85"/><stop offset="100%" stop-color="#FFC85A" stop-opacity="0"/></radialGradient>
    <filter id="ishadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#000" flood-opacity=".55"/></filter>
  </defs>`;
  let s="";
  for(let i=0;i<n;i++){
    const a0=i*seg,a1=(i+1)*seg;
    const [x0,y0]=polar(cx,cy,R,a0),[x1,y1]=polar(cx,cy,R,a1);
    s+=`<path d="M${cx} ${cy} L${x0.toFixed(1)} ${y0.toFixed(1)} A${R} ${R} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)} Z"
      fill="${SEG[i%SEG.length]}" stroke="rgba(0,0,0,.18)" stroke-width="1"/>`;
  }
  let ic="";
  for(let i=0;i<n;i++){
    const mid=i*seg+seg/2,[ix,iy]=polar(cx,cy,R*0.63,mid);
    const size=Math.min(46,Math.max(30,190/n+22));
    ic+=`<g transform="translate(${ix.toFixed(1)} ${iy.toFixed(1)}) rotate(${mid.toFixed(1)}) translate(${-size/2} ${-size/2})" filter="url(#ishadow)">
      <svg width="${size}" height="${size}" viewBox="0 0 48 48" overflow="visible">${iconAt(i)}</svg></g>`;
  }
  let bulbs="";
  const B=24;
  for(let i=0;i<B;i++){
    const [bx,by]=polar(cx,cy,R+24,(360/B)*i);
    bulbs+=`<circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="13" fill="url(#bulbG)" opacity=".9"/>
    <circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="4.2" fill="#FFF3C4"/>`;
  }
  svg.innerHTML=defs+`
    <circle cx="${cx}" cy="${cy}" r="${R+34}" fill="url(#rim)"/>
    <circle cx="${cx}" cy="${cy}" r="${R+32}" fill="none" stroke="rgba(232,201,138,.55)" stroke-width="1.5"/>
    <circle cx="${cx}" cy="${cy}" r="${R+15}" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="2"/>
    <g id="spin"><circle cx="${cx}" cy="${cy}" r="${R}" fill="#0B2417"/>${s}${ic}</g>
    ${bulbs}`;
}
function spinTo(idx,n){
  const seg=360/n,center=idx*seg+seg/2;
  const base=state.angle-state.angle%360;
  const target=base+360*5+((360-center)%360);
  state.angle=target;
  const el=document.getElementById("spin");
  if(!el)return;
  el.style.transition="transform 4.6s cubic-bezier(.16,.86,.06,1)";
  el.style.transform=`rotate(${target}deg)`;
}

/* ---------- рендер ---------- */
const strip=s=>String(s==null?"":s)
  .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{2190}-\u{21FF}\u{2700}-\u{27BF}]/gu,"")
  .replace(/\s{2,}/g," ").trim();

function renderAll(){
  const d=state.data;if(!d)return;
  const pts=d.user?d.user.points:0,cost=d.spin_cost||100;
  $("hTitle").textContent=`Привет, ${(d.user&&d.user.name)||"друг"}!`;
  $("hText").textContent=(d.campaign&&d.campaign.active)
    ?"Кампания идёт: баллы начисляются за комментарии"
    :"Кампания сейчас не идёт: баллы пока не начисляются";
  $("pval").textContent=pts;$("cost").textContent=cost;
  $("pbar").style.width=Math.max(0,Math.min(100,Math.round(pts/cost*100)))+"%";
  const left=Math.max(0,cost-pts);
  $("phint").innerHTML=left>0
    ?`Ещё <b>${left}</b> ${plural(left,"балл","балла","баллов")}, и можно крутить колесо`
    :`Можно крутить колесо! Хватит на <b>${Math.floor(pts/cost)}</b> ${plural(Math.floor(pts/cost),"вращение","вращения","вращений")}`;
  const c=d.counts||{};
  $("cWeek").textContent=c.week||0;$("cMonth").textContent=c.month||0;$("cAll").textContent=c.all||0;
  state.prizes=d.prizes||[];
  renderWheel(state.prizes);renderPrizes();renderTop();
  maybeBonus(d);
}
function renderPrizes(){
  const box=$("prizeList"),l=state.prizes;
  if(!l.length){box.innerHTML='<div class="empty">Призы пока не добавлены.</div>';return}
  box.innerHTML=l.map((p,i)=>{
    const nm=strip(p.name),dt=strip(p.detail);
    return `<div class="prow"><span class="pico">${iconAt(i)}</span>
      <span class="pname">${esc(nm)}${dt?` — <em>${esc(dt)}</em>`:""}</span></div>`;
  }).join("");
}
function renderTop(){
  const box=$("topList");
  let rows=((state.data&&state.data.top&&state.data.top[state.period])||[]).slice(0,5);
  if(!rows.length){box.innerHTML='<div class="empty">Пока нет данных.</div>';return}
  box.innerHTML=rows.map((r,i)=>`
    <div class="trow${r.me?" me":""}">
      <span class="tpos">${i<3?medal(i+1):`<span class="num">${i+1}</span>`}</span>
      <span class="tname">${esc(r.name)}</span>
      <span class="tcount">${r.count}</span>
    </div>`).join("");
}
function plural(n,o,f,m){const a=Math.abs(n)%100,b=a%10;
  if(a>10&&a<20)return m;if(b>1&&b<5)return f;if(b===1)return o;return m}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

/* ---------- бонус ---------- */
const bonusKey=()=>"bonus_"+new Date().toISOString().slice(0,10);
function maybeBonus(d){
  const bar=$("bonusBar");
  if(!d||!d.daily_bonus||d.daily_bonus<=0){bar.style.display="none";return}
  if(localStorage.getItem(bonusKey())){bar.style.display="none";return}
  $("bonusText").textContent=`Бонус к балансу +${d.daily_bonus} ${plural(d.daily_bonus,"балл","балла","баллов")}`;
  bar.style.display="flex";
}
$("bonusBtn").addEventListener("click",()=>{
  const d=state.data;if(!d)return;
  localStorage.setItem(bonusKey(),"1");
  $("bonusBar").style.display="none";
  toast(`+${d.daily_bonus} ${plural(d.daily_bonus,"балл","балла","баллов")} зачислено`);
});

/* ---------- снег ---------- */
function startSnow(){
  const cv=$("snow"),ctx=cv.getContext("2d");
  let W=0,H=0,dpr=Math.min(window.devicePixelRatio||1,2),fl=[],gl=[];
  function resize(){
    W=cv.clientWidth;H=cv.clientHeight;
    cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.round(W*H/16000);
    fl=Array.from({length:Math.min(Math.max(n,35),110)},()=>nf(true));
    gl=Array.from({length:26},()=>ng(true));
  }
  const nf=i=>({x:Math.random()*W,y:i?Math.random()*H:-10,r:.7+Math.random()*2,
    vy:.18+Math.random()*.5,vx:(Math.random()-.5)*.2,ph:Math.random()*6.28,sp:.4+Math.random()*.9,
    a:.3+Math.random()*.45});
  const ng=i=>({x:Math.random()*W,y:i?Math.random()*H:-10,r:.6+Math.random()*1.3,
    vy:.1+Math.random()*.3,vx:(Math.random()-.5)*.3,ph:Math.random()*6.28,sp:1.4+Math.random()*2});
  let t=0;
  function frame(){
    t+=.016;ctx.clearRect(0,0,W,H);
    for(const f of fl){
      f.y+=f.vy;f.x+=f.vx+Math.sin(t*f.sp+f.ph)*.26;
      if(f.y>H+8)Object.assign(f,nf(false));
      if(f.x<-8)f.x=W+8;if(f.x>W+8)f.x=-8;
      const tw=.72+.28*Math.sin(t*f.sp*1.7+f.ph);
      ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,6.283);
      ctx.fillStyle=`rgba(240,248,255,${(f.a*tw).toFixed(3)})`;ctx.fill();
    }
    for(const g of gl){
      g.y+=g.vy;g.x+=g.vx+Math.sin(t*.7+g.ph)*.16;
      if(g.y>H+8)Object.assign(g,ng(false));
      if(g.x<-8)g.x=W+8;if(g.x>W+8)g.x=-8;
      const k=Math.max(0,Math.sin(t*g.sp+g.ph));if(k<.05)continue;
      const r=g.r*(.6+k*1.5);
      const gr=ctx.createRadialGradient(g.x,g.y,0,g.x,g.y,r*4);
      gr.addColorStop(0,`rgba(255,240,200,${(.85*k).toFixed(3)})`);
      gr.addColorStop(1,"rgba(255,220,150,0)");
      ctx.fillStyle=gr;ctx.beginPath();ctx.arc(g.x,g.y,r*4,0,6.283);ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  resize();window.addEventListener("resize",resize);requestAnimationFrame(frame);
}

/* ---------- действия ---------- */
let tt=null;
function toast(m){const e=$("toast");e.textContent=m;e.classList.add("on");
  clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),3200)}
function showModal(i,t,x){$("mIco").textContent=i;$("mTitle").textContent=t;$("mText").textContent=x;$("modal").classList.add("on")}

async function load(){
  if(PREVIEW){state.data=previewData();renderAll();return}
  try{const d=await api("/api/me",{initData});
    if(d.error){toast("Не удалось авторизоваться");return}
    state.data=d;renderAll();
  }catch(e){toast("Не получилось загрузить данные")}
}
async function doSpin(){
  if(state.spinning)return;const d=state.data;if(!d)return;
  const cost=d.spin_cost||100;
  if((d.user.points||0)<cost){toast("Не хватает баллов");return}
  state.spinning=true;
  if(PREVIEW){
    const n=Math.max(state.prizes.length,1),idx=Math.floor(Math.random()*n);
    spinTo(idx,n);
    setTimeout(()=>{state.spinning=false;
      const p=state.prizes[idx];
      showModal("🎉","Демо-режим",`Выпало: ${strip(p?p.name:"—")}. В Telegram здесь будет настоящий приз.`)},4800);
    return;
  }
  try{
    const r=await api("/api/spin",{initData});
    if(r.error){state.spinning=false;toast(r.message||"Не удалось крутить");return}
    const list=r.prizes||state.prizes,n=Math.max(list.length,1);
    const idx=Math.max(0,list.findIndex(p=>p.id===(r.prize&&r.prize.id)));
    spinTo(idx,n);
    setTimeout(()=>{
      state.spinning=false;
      if(r.points!=null&&state.data)state.data.user.points=r.points;
      if(r.prizes)state.prizes=r.prizes;
      renderAll();
      const nm=strip(r.prize?r.prize.name:"—");
      const b=r.nothing_bonus?` Начислено +${r.nothing_bonus} баллов.`:"";
      showModal("🎉","Поздравляем!",`Вам выпало: ${nm}.${b} Остаток баллов: ${r.points}.`);
    },4800);
  }catch(e){state.spinning=false;toast("Ошибка сети, попробуйте ещё раз")}
}

$("hub").addEventListener("click",doSpin);
$("mClose").addEventListener("click",()=>$("modal").classList.remove("on"));
$("modal").addEventListener("click",e=>{if(e.target.id==="modal")$("modal").classList.remove("on")});
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
  t.classList.add("on");state.period=t.dataset.p;renderTop();
}));

startSnow();
load();
</script>
