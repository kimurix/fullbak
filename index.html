<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#12281a" />
<title>Full Bak Points</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --cream:#f6eeda;
    --cream-dim:rgba(246,238,218,.68);
    --gold:#e8c98a;
    --gold-strong:#f3d99b;
    --card:rgba(58,80,54,.82);
    --card-2:rgba(40,58,40,.86);
    --red-1:#6b1212;
    --red-2:#8f1d1d;
    --red-3:#a8271f;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0; padding:0; height:100%;
    background:#0b1a11;
    color:var(--cream);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    overscroll-behavior:none;
    -webkit-font-smoothing:antialiased;
  }

  /* ================= ФОН ================= */
  #bg{
    position:fixed; inset:0; z-index:0; overflow:hidden;
    background:
      radial-gradient(75% 40% at 50% 0%, #3a6b4a 0%, rgba(58,107,74,0) 72%),
      radial-gradient(55% 35% at 8% 22%, #2f5c40 0%, rgba(47,92,64,0) 78%),
      radial-gradient(55% 35% at 92% 26%, #2f5c40 0%, rgba(47,92,64,0) 78%),
      radial-gradient(80% 30% at 50% 100%, #2a5c3e 0%, rgba(42,92,62,0) 75%),
      linear-gradient(180deg, #1e3a28 0%, #17301f 42%, #12281a 72%, #0e2015 100%);
  }
  #bg::after{
    content:"";
    position:absolute; inset:0;
    background:radial-gradient(90% 60% at 50% 42%, rgba(0,0,0,0) 45%, rgba(0,0,0,.42) 100%);
    pointer-events:none;
  }
  #treeLayer{ position:absolute; inset:0; width:100%; height:100%; }
  #snowCanvas{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  #bottomLayer{
    position:absolute; left:0; right:0; bottom:0;
    height:min(46vh, 380px);
    pointer-events:none;
  }

  .bulb{ animation:bulbTwinkle 3.4s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  @keyframes bulbTwinkle{
    0%,100%{ opacity:.35; filter:drop-shadow(0 0 3px rgba(255,220,150,.45)); }
    45%{ opacity:1; filter:drop-shadow(0 0 12px rgba(255,225,160,1)); }
    62%{ opacity:.85; filter:drop-shadow(0 0 7px rgba(255,220,150,.8)); }
  }
  .bokeh{ animation:bokehPulse 5.5s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  @keyframes bokehPulse{
    0%,100%{ opacity:.30; }
    50%{ opacity:.95; }
  }

  /* ================= КОНТЕНТ ================= */
  #app{
    position:fixed; inset:0; z-index:2;
    overflow-y:auto; overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    padding:
      calc(env(safe-area-inset-top, 0px) + 24px)
      16px
      calc(env(safe-area-inset-bottom, 0px) + 260px);
    scrollbar-width:none;
  }
  #app::-webkit-scrollbar{ display:none; }
  .wrap{ max-width:460px; margin:0 auto; }

  /* ---------- карточки ---------- */
  .card{
    border-radius:26px;
    border:1.5px solid rgba(232,201,138,.45);
    background:linear-gradient(180deg, var(--card), var(--card-2));
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    box-shadow:
      0 18px 40px rgba(0,0,0,.50),
      0 0 0 1px rgba(0,0,0,.18),
      inset 0 1px 0 rgba(255,255,255,.12);
    padding:18px;
    margin-bottom:16px;
  }

  /* приветствие */
  .hello{
    background:linear-gradient(155deg, var(--red-3) 0%, var(--red-2) 46%, var(--red-1) 100%);
    border-color:rgba(232,201,138,.55);
    box-shadow:0 20px 44px rgba(70,6,6,.60), inset 0 1px 0 rgba(255,255,255,.20);
    position:relative; overflow:hidden;
    padding:20px 18px;
  }
  .hello::before{
    content:"";
    position:absolute; inset:0;
    background:
      radial-gradient(110% 90% at 88% -20%, rgba(255,255,255,.22), rgba(255,255,255,0) 62%),
      radial-gradient(70% 60% at 0% 120%, rgba(255,120,90,.28), rgba(255,120,90,0) 70%);
    pointer-events:none;
  }
  .hello h1{
    margin:0 0 10px;
    font-family:Georgia,"Times New Roman",serif;
    font-size:27px; font-weight:600; line-height:1.18;
    color:#fff8f0;
    text-shadow:0 2px 14px rgba(0,0,0,.45);
    position:relative;
  }
  .hello p{
    margin:0; font-size:13.5px; line-height:1.5;
    color:rgba(255,240,232,.94);
    max-width:78%;
    position:relative;
  }
  .hello .flake{
    position:absolute; right:16px; top:50%; transform:translateY(-50%);
    opacity:.55; pointer-events:none;
  }

  /* ---------- ЕДИНАЯ плашка баллов ---------- */
  .points{ padding:0; overflow:hidden; }
  .points-top{
    display:flex; align-items:flex-start; justify-content:space-between;
    gap:12px; padding:18px 18px 0;
  }
  .points-label{ font-size:13px; color:var(--cream-dim); margin-bottom:4px; }
  .points-value{
    display:flex; align-items:center; gap:9px;
    font-size:44px; font-weight:700; line-height:1;
    letter-spacing:-1.2px;
    text-shadow:0 4px 20px rgba(0,0,0,.55);
  }
  .points-value .heart{ font-size:24px; filter:drop-shadow(0 0 12px rgba(255,70,100,.75)); }
  .points-cost{
    text-align:right; font-size:13px; color:var(--cream-dim);
    padding-top:8px; white-space:nowrap;
  }
  .points-cost b{ color:var(--gold-strong); font-weight:600; }

  .points-mid{
    display:flex; align-items:center; gap:12px;
    padding:16px 18px 0;
  }
  .gift-ico{ flex:0 0 auto; filter:drop-shadow(0 8px 12px rgba(0,0,0,.6)); }
  .bar{
    flex:1 1 auto; height:17px; border-radius:99px;
    background:linear-gradient(180deg, rgba(20,34,24,.85), rgba(38,58,40,.85));
    border:1px solid rgba(232,201,138,.30);
    overflow:hidden;
    box-shadow:inset 0 2px 8px rgba(0,0,0,.55), 0 1px 0 rgba(255,255,255,.06);
  }
  .bar > i{
    display:block; height:100%; width:0%;
    border-radius:99px;
    background:linear-gradient(90deg, #e8c98a, #fff0c4 55%, #e8c98a);
    box-shadow:0 0 18px rgba(232,201,138,.85);
    transition:width .8s cubic-bezier(.2,.9,.2,1);
  }
  .points-hint{
    padding:14px 18px 18px;
    font-size:12.5px; color:var(--cream-dim);
    border-top:1px solid rgba(232,201,138,.20);
    margin-top:16px;
  }
  .points-hint b{ color:var(--cream); }

  /* ---------- комментарии ---------- */
  .card-title{
    display:flex; align-items:center; gap:8px;
    font-size:14.5px; font-weight:600; margin-bottom:14px;
  }
  .stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .stat{
    border-radius:16px;
    border:1px solid rgba(232,201,138,.38);
    background:linear-gradient(180deg, rgba(92,116,82,.72), rgba(58,78,54,.72));
    padding:13px 6px 11px;
    text-align:center;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.10);
  }
  .stat b{ display:block; font-size:24px; font-weight:700; line-height:1.1; }
  .stat span{ display:block; font-size:10.5px; color:var(--cream-dim); margin-top:4px; }

  /* ---------- лента ---------- */
  .ribbon{
    position:relative;
    margin:22px auto 14px;
    max-width:320px;
    display:flex; align-items:center; justify-content:center; gap:10px;
    padding:11px 30px;
    font-family:Georgia,"Times New Roman",serif;
    font-size:17.5px; letter-spacing:.3px;
    color:#ffeecb;
    background:linear-gradient(180deg, #a8271f, #6b1212);
    border:1.5px solid rgba(232,201,138,.85);
    border-radius:8px;
    box-shadow:0 14px 30px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .ribbon::before,.ribbon::after{
    content:"";
    position:absolute; top:0; bottom:0; width:16px;
    background:linear-gradient(180deg, #a8271f, #6b1212);
  }
  .ribbon::before{ left:-15px; clip-path:polygon(100% 0, 0 50%, 100% 100%); }
  .ribbon::after{ right:-15px; clip-path:polygon(0 0, 100% 50%, 0 100%); }
  .ribbon svg{ width:18px; height:18px; flex:0 0 auto; opacity:.95; }

  /* ---------- колесо ---------- */
  .wheel-box{
    position:relative;
    width:min(92vw, 400px);
    margin:0 auto 8px;
    aspect-ratio:1/1;
  }
  #wheelSvg{ width:100%; height:100%; display:block; filter:drop-shadow(0 18px 34px rgba(0,0,0,.55)); }
  #wheelSpin{ transform-origin:50% 50%; transform:rotate(0deg); will-change:transform; }
  .rim-bulb{ animation:rimTwinkle 2.6s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  @keyframes rimTwinkle{
    0%,100%{ opacity:.45; }
    50%{ opacity:1; }
  }
  .hub{
    position:absolute; left:50%; top:50%;
    width:17%; height:17%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    border:none; padding:0;
    background:radial-gradient(circle at 36% 30%, #ffffff 0%, #fdf2f2 55%, #e9d3d3 100%);
    box-shadow:0 0 0 3px rgba(232,201,138,.70), 0 12px 28px rgba(0,0,0,.65);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:transform .15s ease;
  }
  .hub:active{ transform:translate(-50%,-50%) scale(.94); }
  .hub svg{ width:54%; height:54%; }

  /* ---------- нарядная кнопка ---------- */
  .spin-btn{
    position:relative;
    display:block; width:100%;
    margin:18px 0 10px;
    padding:19px 22px;
    border-radius:22px;
    border:2px solid rgba(232,201,138,.90);
    background:linear-gradient(180deg, #b32d22 0%, #8f1d1d 52%, #6b1212 100%);
    color:#fff6ea;
    font-family:Georgia,"Times New Roman",serif;
    font-size:17px; font-weight:600; letter-spacing:.3px;
    text-shadow:0 2px 10px rgba(0,0,0,.5);
    box-shadow:
      0 20px 44px rgba(70,6,6,.60),
      0 0 0 1px rgba(0,0,0,.25),
      inset 0 1px 0 rgba(255,255,255,.32),
      inset 0 -3px 12px rgba(0,0,0,.45);
    cursor:pointer;
    overflow:hidden;
    transition:transform .15s ease, filter .2s ease;
  }
  .spin-btn::before{
    content:"";
    position:absolute; inset:4px;
    border-radius:18px;
    border:1px solid rgba(255,225,170,.30);
    pointer-events:none;
  }
  .spin-btn::after{
    content:"";
    position:absolute; top:-10%; bottom:-10%; width:55%;
    background:linear-gradient(100deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.34) 50%, rgba(255,255,255,0) 100%);
    transform:translateX(-160%);
    animation:shimmer 4s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes shimmer{
    0%{ transform:translateX(-160%); }
    55%,100%{ transform:translateX(280%); }
  }
  .spin-btn:active{ transform:scale(.985); filter:brightness(1.08); }
  .spin-btn:disabled{ opacity:.6; cursor:default; }
  .spin-btn:disabled::after{ animation:none; }

  /* ---------- призы ---------- */
  .prize-row{
    display:flex; align-items:center; gap:12px;
    padding:11px 0;
    border-bottom:1px solid rgba(232,201,138,.18);
    font-size:13.5px;
  }
  .prize-row:last-child{ border-bottom:none; }
  .prize-ico{ flex:0 0 34px; width:34px; height:34px; display:flex; align-items:center; justify-content:center; }
  .prize-ico svg{ width:100%; height:100%; }
  .prize-name{ flex:1 1 auto; min-width:0; word-break:break-word; line-height:1.4; }
  .prize-name em{ font-style:normal; color:var(--cream-dim); }
  .prize-stock{ font-size:11px; color:var(--cream-dim); }

  /* ---------- топы ---------- */
  .tabs{ display:flex; gap:7px; margin-bottom:14px; }
  .tab{
    flex:1 1 0; padding:10px 4px;
    border-radius:13px;
    border:1px solid rgba(232,201,138,.28);
    background:rgba(255,255,255,.06);
    color:var(--cream-dim);
    font-size:12.5px; cursor:pointer;
    transition:.2s;
  }
  .tab.on{
    background:linear-gradient(180deg, rgba(232,201,138,.30), rgba(232,201,138,.14));
    border-color:rgba(232,201,138,.70);
    color:var(--cream);
  }
  .top-row{
    display:flex; align-items:center; gap:11px;
    padding:10px 0; font-size:13.5px;
    border-bottom:1px solid rgba(232,201,138,.16);
  }
  .top-row:last-child{ border-bottom:none; }
  .top-row.me{ color:var(--gold-strong); }
  .top-pos{ flex:0 0 24px; text-align:center; font-weight:700; color:var(--cream-dim); }
  .top-name{ flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .top-c{ flex:0 0 auto; font-weight:600; }

  .empty{ font-size:13px; color:var(--cream-dim); padding:6px 0; }

  /* ---------- модалка / тост ---------- */
  .modal{
    position:fixed; inset:0; z-index:20;
    display:none; align-items:center; justify-content:center;
    padding:24px;
    background:rgba(6,14,9,.76);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  }
  .modal.on{ display:flex; }
  .modal-card{
    width:100%; max-width:330px;
    border-radius:26px;
    border:1.5px solid rgba(232,201,138,.65);
    background:linear-gradient(180deg, rgba(70,92,64,.98), rgba(24,38,26,.98));
    box-shadow:0 26px 64px rgba(0,0,0,.70);
    padding:26px 20px;
    text-align:center;
    animation:pop .35s cubic-bezier(.2,1.2,.4,1);
  }
  @keyframes pop{ from{ transform:scale(.86); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .modal-card .big{ font-size:52px; line-height:1; margin-bottom:12px; }
  .modal-card h3{ margin:0 0 8px; font-family:Georgia,serif; font-size:20px; font-weight:600; }
  .modal-card p{ margin:0 0 20px; font-size:13.5px; color:var(--cream-dim); line-height:1.5; }
  .modal-card button{
    width:100%; padding:15px; border-radius:15px;
    border:1px solid rgba(232,201,138,.6);
    background:linear-gradient(180deg,#a8271f,#6b1212);
    color:#fff6ea; font-size:15px; font-weight:600; cursor:pointer;
  }

  .toast{
    position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 26px);
    transform:translate(-50%, 20px);
    z-index:30;
    padding:13px 19px;
    border-radius:15px;
    background:rgba(58,80,54,.98);
    border:1px solid rgba(232,201,138,.65);
    color:var(--cream); font-size:13.5px;
    box-shadow:0 14px 34px rgba(0,0,0,.60);
    opacity:0; pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    max-width:88vw; text-align:center;
  }
  .toast.on{ opacity:1; transform:translate(-50%,0); }

  @media (prefers-reduced-motion: reduce){
    .bulb,.rim-bulb,.bokeh,.spin-btn::after{ animation:none; opacity:.85; }
  }
</style>
</head>
<body>

<div id="bg">
  <svg id="treeLayer" preserveAspectRatio="xMidYMid slice" viewBox="0 0 390 844" aria-hidden="true"></svg>
  <canvas id="snowCanvas" aria-hidden="true"></canvas>
  <svg id="bottomLayer" preserveAspectRatio="xMidYMax slice" viewBox="0 0 390 300" aria-hidden="true"></svg>
</div>

<div id="app">
  <div class="wrap">

    <div class="card hello">
      <h1 id="helloTitle">Привет, @pln_bak! 💗</h1>
      <p id="helloText">Загружаем данные…</p>
      <svg class="flake" width="54" height="54" viewBox="0 0 48 48" fill="none" stroke="rgba(255,255,255,.95)" stroke-width="1.5" stroke-linecap="round">
        <path d="M24 6v36M8 15l32 18M40 15L8 33"/>
        <path d="M24 11l-4 4M24 11l4 4M24 37l-4-4M24 37l4-4M11 19l1 5M11 29l1-5M37 19l-1 5M37 29l-1-5"/>
      </svg>
    </div>

    <div class="card points">
      <div class="points-top">
        <div>
          <div class="points-label">Твои баллы</div>
          <div class="points-value">
            <span id="pointsVal">0</span>
            <span class="heart">💗</span>
          </div>
        </div>
        <div class="points-cost">
          Вращение — <b><span id="spinCost">100</span> баллов</b>
        </div>
      </div>

      <div class="points-mid">
        <svg class="gift-ico" width="38" height="38" viewBox="0 0 48 48" aria-hidden="true">
          <defs>
            <linearGradient id="pg1" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#f06a4f"/><stop offset="1" stop-color="#9e1f1f"/>
            </linearGradient>
            <linearGradient id="pg2" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fff0c4"/><stop offset="1" stop-color="#d4a63c"/>
            </linearGradient>
          </defs>
          <ellipse cx="24" cy="43" rx="15" ry="3.2" fill="rgba(0,0,0,.45)"/>
          <rect x="9" y="20" width="30" height="21" rx="3" fill="url(#pg1)"/>
          <rect x="9" y="20" width="30" height="6" rx="3" fill="url(#pg2)"/>
          <rect x="21" y="20" width="6" height="21" fill="url(#pg2)"/>
          <path d="M24 20c-6.5 0-11-3-11-6.2S19.5 10 24 20c4.5-10 11-9.2 11-6.2S30.5 20 24 20z" fill="url(#pg2)"/>
        </svg>
        <div class="bar"><i id="pointsBar"></i></div>
      </div>

      <div class="points-hint" id="pointsHint">Ещё <b>100</b> баллов, и можно крутить колесо</div>
    </div>

    <div class="card">
      <div class="card-title">💗 Твои комментарии</div>
      <div class="stats">
        <div class="stat"><b id="cWeek">0</b><span>за 7 дней</span></div>
        <div class="stat"><b id="cMonth">0</b><span>за 30 дней</span></div>
        <div class="stat"><b id="cAll">0</b><span>всего</span></div>
      </div>
    </div>

    <div class="ribbon">
      <svg viewBox="0 0 48 48" fill="none" stroke="#ffeecb" stroke-width="2.6" stroke-linecap="round">
        <path d="M24 7v34M9 15.5l30 17M39 15.5l-30 17"/>
        <path d="M24 12l-4 4M24 12l4 4M24 36l-4-4M24 36l4-4"/>
      </svg>
      <span>Колесо призов</span>
      <svg viewBox="0 0 48 48" fill="none" stroke="#ffeecb" stroke-width="2.6" stroke-linecap="round">
        <path d="M24 7v34M9 15.5l30 17M39 15.5l-30 17"/>
        <path d="M24 12l-4 4M24 12l4 4M24 36l-4-4M24 36l4-4"/>
      </svg>
    </div>

    <div class="wheel-box">
      <svg id="wheelSvg" viewBox="0 0 400 400" aria-hidden="true"></svg>
      <button class="hub" id="hub" aria-label="Крутить">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path d="M24 41s-13-8.2-13-17.2A7.8 7.8 0 0 1 24 18a7.8 7.8 0 0 1 13 5.8C37 32.8 24 41 24 41z" fill="#c62828"/>
          <path d="M24 38s-10-6.6-10-13.6A6 6 0 0 1 24 20a6 6 0 0 1 10 4.4C34 31.4 24 38 24 38z" fill="#ef6a5c" opacity=".55"/>
        </svg>
      </button>
    </div>

    <button class="spin-btn" id="spinBtn">Крутить колесо — 100 баллов</button>

    <div class="card">
      <div class="card-title">🏆 Самые активные</div>
      <div class="tabs">
        <button class="tab on" data-period="week">7 дней</button>
        <button class="tab" data-period="month">30 дней</button>
        <button class="tab" data-period="all">Всё время</button>
      </div>
      <div id="topList"><div class="empty">Загружаем…</div></div>
    </div>

    <div class="card">
      <div class="card-title">🎁 Призы</div>
      <div id="prizeList"><div class="empty">Загружаем…</div></div>
    </div>

  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-card">
    <div class="big" id="modalIco">🎉</div>
    <h3 id="modalTitle">Поздравляем!</h3>
    <p id="modalText"></p>
    <button id="modalClose">Отлично</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = "https://tg-activity-bot.katka-69.workers.dev";

const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor("#12281a"); tg.setBackgroundColor && tg.setBackgroundColor("#12281a"); } catch(e){} }

const initData = tg && tg.initData ? tg.initData : "";
const PREVIEW = !initData;

const $ = (id) => document.getElementById(id);

const state = { data: null, period: "week", spinning: false, wheelAngle: 0, prizes: [] };

async function api(path, body) {
  const res = await fetch(API + path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body || {}),
  });
  return res.json();
}

function previewData() {
  return {
    user: { id: 1, name: "@pln_bak", points: 0 },

function stripEmoji(s) {
  return String(s == null ? "" : s)
    .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}\u{2190}-\u{21FF}]/gu, "")
    .replace(/\s{2,}/g, " ")
    .replace(/^[\s\-—–:•]+|[\s\-—–:•]+$/g, "")
    .trim();
}

/* ================= ФОН: густая хвоя ================= */
function buildTree() {
  const svg = $("treeLayer");
  const W = 390, H = 844;

  const defs = `
    <defs>
      <linearGradient id="pineBack" x1="0" y1="0" x2="1" y2="0.6">
        <stop offset="0" stop-color="#1d4a30"/><stop offset="1" stop-color="#0c2417"/>
      </linearGradient>
      <linearGradient id="pineFront" x1="0" y1="0" x2="1" y2="0.6">
        <stop offset="0" stop-color="#3d8a58"/><stop offset="0.55" stop-color="#226b41"/><stop offset="1" stop-color="#123a24"/>
      </linearGradient>
      <radialGradient id="bulbGlow"><stop offset="0" stop-color="#fff0c4" stop-opacity="1"/><stop offset="1" stop-color="#ffcf6b" stop-opacity="0"/></radialGradient>
      <radialGradient id="ornRed" cx="34%" cy="28%" r="72%">
        <stop offset="0" stop-color="#ff9a82"/><stop offset="42%" stop-color="#c62828"/><stop offset="100%" stop-color="#6b1212"/>
      </radialGradient>
      <radialGradient id="ornGold" cx="34%" cy="28%" r="72%">
        <stop offset="0" stop-color="#fff6d6"/><stop offset="45%" stop-color="#e8c98a"/><stop offset="100%" stop-color="#9a7430"/>
      </radialGradient>
      <radialGradient id="bokehG"><stop offset="0" stop-color="#ffe0a0" stop-opacity=".95"/><stop offset="1" stop-color="#ffd98a" stop-opacity="0"/></radialGradient>
    </defs>`;

  let body = "";

  // ветка: изогнутая «лапа» с снежной кромкой
  const branch = (cx, y, len, dir, fill, snowOp) => {
    const x1 = cx + dir * len;
    const path = `M${cx} ${y} Q ${(cx + dir * len * 0.5).toFixed(1)} ${(y - 18).toFixed(1)} ${x1.toFixed(1)} ${(y + 10).toFixed(1)} Q ${(cx + dir * len * 0.55).toFixed(1)} ${(y + 34).toFixed(1)} ${cx} ${(y + 44).toFixed(1)} Z`;
    return `<path d="${path}" fill="${fill}"/>` +
      `<path d="M${cx} ${y} Q ${(cx + dir * len * 0.5).toFixed(1)} ${(y - 18).toFixed(1)} ${x1.toFixed(1)} ${(y + 10).toFixed(1)}"
        fill="none" stroke="rgba(240,250,255,${snowOp})" stroke-width="4" stroke-linecap="round"/>`;
  };

  // дальний план — темнее и короче
  for (let i = 0; i < 14; i++) {
    const y = 10 + i * 62;
    body += branch(-42, y, 74 + i * 4, 1, "url(#pineBack)", 0.30);
    body += branch(W + 42, y + 30, 74 + i * 4, -1, "url(#pineBack)", 0.30);
  }

  // ближний план — ярче и длиннее
  for (let i = 0; i < 14; i++) {
    const y = 40 + i * 62;
    body += branch(-48, y, 104 + i * 6, 1, "url(#pineFront)", 0.55);
    body += branch(W + 48, y + 32, 104 + i * 6, -1, "url(#pineFront)", 0.55);
  }

  // тёплые огоньки в глубине
  let bokeh = "";
  const spots = [
    [66,110,16],[148,64,12],[252,88,14],[332,140,18],[42,290,13],[352,320,16],
    [92,450,15],[300,500,13],[58,630,17],[332,672,14],[196,40,11],[210,760,12]
  ];
  spots.forEach(([x, y, r], i) => {
    bokeh += `<circle cx="${x}" cy="${y}" r="${r}" fill="url(#bokehG)" class="bokeh" style="animation-delay:${(i * 0.6).toFixed(1)}s"/>`;
  });

  // ёлочные шары
  const orn = (x, y, r, grad, cap) => `
    <line x1="${x}" y1="0" x2="${x}" y2="${y - r - 4}" stroke="rgba(232,201,138,.55)" stroke-width="1.3"/>
    <rect x="${x - 3.5}" y="${y - r - 7}" width="7" height="8" rx="2" fill="${cap}"/>
    <circle cx="${x}" cy="${y}" r="${r}" fill="url(#${grad})"/>
    <ellipse cx="${(x - r * 0.34).toFixed(1)}" cy="${(y - r * 0.38).toFixed(1)}" rx="${(r * 0.3).toFixed(1)}" ry="${(r * 0.19).toFixed(1)}"
      fill="rgba(255,255,255,.65)" transform="rotate(-30 ${(x - r * 0.34).toFixed(1)} ${(y - r * 0.38).toFixed(1)})"/>`;

  const ornaments =
    orn(108, 96, 28, "ornRed", "#d4a63c") +
    orn(316, 122, 24, "ornGold", "#d4a63c") +
    orn(352, 214, 22, "ornRed", "#d4a63c") +
    orn(32, 182, 17, "ornGold", "#d4a63c") +
    orn(18, 430, 15, "ornRed", "#d4a63c") +
    orn(374, 486, 16, "ornGold", "#d4a63c");

  // гирлянда
  const colors = ["#ffe9b0", "#fff6d6", "#ffd98a", "#fffbe8"];
  let bulbs = "";
  let k = 0;
  for (let y = 48; y < H - 40; y += 42) {
    const xL = 26 + Math.sin(y / 38) * 11;
    const xR = W - 26 - Math.sin(y / 44) * 11;
    const cL = colors[k % colors.length];
    const cR = colors[(k + 2) % colors.length];
    bulbs += `<circle cx="${xL.toFixed(1)}" cy="${y}" r="16" fill="url(#bulbGlow)" class="bulb" style="animation-delay:${(k * 0.31).toFixed(2)}s"/>`;
    bulbs += `<circle cx="${xL.toFixed(1)}" cy="${y}" r="3.4" fill="${cL}" class="bulb" style="animation-delay:${(k * 0.31).toFixed(2)}s"/>`;
    bulbs += `<circle cx="${xR.toFixed(1)}" cy="${y + 12}" r="16" fill="url(#bulbGlow)" class="bulb" style="animation-delay:${(k * 0.27 + 0.9).toFixed(2)}s"/>`;
    bulbs += `<circle cx="${xR.toFixed(1)}" cy="${y + 12}" r="3.4" fill="${cR}" class="bulb" style="animation-delay:${(k * 0.27 + 0.9).toFixed(2)}s"/>`;
    k++;
  }

  svg.innerHTML = defs + body + bokeh + bulbs + ornaments;
}

/* ================= СНЕГ И БЛЁСТКИ ================= */
function startSnow() {
  const cv = $("snowCanvas");
  const ctx = cv.getContext("2d");
  let W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
  let flakes = [], glints = [];

  function resize() {
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.floor(W * dpr); cv.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round((W * H) / 12000);
    flakes = Array.from({ length: Math.min(Math.max(n, 50), 150) }, () => newFlake(true));
    glints = Array.from({ length: 40 }, () => newGlint(true));
  }

  function newFlake(init) {
    return {
      x: Math.random() * W,
      y: init ? Math.random() * H : -10,
      r: 0.8 + Math.random() * 2.3,
      vy: 0.20 + Math.random() * 0.60,
      vx: (Math.random() - 0.5) * 0.24,
      ph: Math.random() * Math.PI * 2,
      sp: 0.4 + Math.random() * 0.9,
      a: 0.40 + Math.random() * 0.55,
    };
  }

  function newGlint(init) {
    return {
      x: Math.random() * W,
      y: init ? Math.random() * H : -10,
      r: 0.6 + Math.random() * 1.5,
      vy: 0.10 + Math.random() * 0.34,
      vx: (Math.random() - 0.5) * 0.36,
      ph: Math.random() * Math.PI * 2,
      sp: 1.4 + Math.random() * 2.2,
    };
  }

  let t = 0;
  function frame() {
    t += 0.016;
    ctx.clearRect(0, 0, W, H);

    for (const f of flakes) {
      f.y += f.vy;
      f.x += f.vx + Math.sin(t * f.sp + f.ph) * 0.30;
      if (f.y > H + 8) Object.assign(f, newFlake(false));
      if (f.x < -8) f.x = W + 8;
      if (f.x > W + 8) f.x = -8;
      const tw = 0.72 + 0.28 * Math.sin(t * f.sp * 1.7 + f.ph);
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(248,252,255,${(f.a * tw).toFixed(3)})`;
      ctx.fill();
    }

    for (const g of glints) {
      g.y += g.vy;
      g.x += g.vx + Math.sin(t * 0.7 + g.ph) * 0.18;
      if (g.y > H + 8) Object.assign(g, newGlint(false));
      if (g.x < -8) g.x = W + 8;
      if (g.x > W + 8) g.x = -8;
      const k = Math.max(0, Math.sin(t * g.sp + g.ph));
      if (k < 0.05) continue;
      const r = g.r * (0.6 + k * 1.6);
      const grad = ctx.createRadialGradient(g.x, g.y, 0, g.x, g.y, r * 4);
      grad.addColorStop(0, `rgba(255,244,210,${(0.95 * k).toFixed(3)})`);
      grad.addColorStop(1, "rgba(255,220,150,0)");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(g.x, g.y, r * 4, 0, Math.PI * 2);
      ctx.fill();
    }

    requestAnimationFrame(frame);
  }

  resize();
  window.addEventListener("resize", resize);
  requestAnimationFrame(frame);
}

/* ================= КОЛЕСО ================= */
const SEG_FILL = ["#1f4a2e", "#f7ecd8", "#8f1d1d", "#f7ecd8"];

function polar(cx, cy, r, deg) {
  const a = (deg - 90) * Math.PI / 180;
  return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
}

function renderWheel(prizes) {
  const svg = $("wheelSvg");
  const n = Math.max(prizes.length, 1);
  const seg = 360 / n;
  const cx = 200, cy = 200, R = 164;

  const defs = `
    <defs>
      <radialGradient id="rimGrad" cx="50%" cy="50%" r="50%">
        <stop offset="82%" stop-color="#6b4a1e"/>
        <stop offset="94%" stop-color="#c9a25e"/>
        <stop offset="100%" stop-color="#3a2410"/>
      </radialGradient>
      <radialGradient id="wheelShade" cx="42%" cy="32%" r="74%">
        <stop offset="0" stop-color="rgba(255,255,255,.20)"/>
        <stop offset="58%" stop-color="rgba(0,0,0,0)"/>
        <stop offset="100%" stop-color="rgba(0,0,0,.42)"/>
      </radialGradient>
    </defs>`;

  let segs = "";
  for (let i = 0; i < n; i++) {
    const a0 = i * seg, a1 = (i + 1) * seg;
    const [x0, y0] = polar(cx, cy, R, a0);
    const [x1, y1] = polar(cx, cy, R, a1);
    const large = seg > 180 ? 1 : 0;
    segs += `<path d="M${cx} ${cy} L${x0.toFixed(2)} ${y0.toFixed(2)} A${R} ${R} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z"
      fill="${SEG_FILL[i % SEG_FILL.length]}" stroke="rgba(0,0,0,.18)" stroke-width="1"/>`;
  }

  let icons = "";
  for (let i = 0; i < n; i++) {
    const mid = i * seg + seg / 2;
    const [ix, iy] = polar(cx, cy, R * 0.64, mid);
    const kind = iconByIndex(i);
    const size = Math.min(50, Math.max(32, 230 / n + 24));
    icons += `<g transform="translate(${ix.toFixed(2)} ${iy.toFixed(2)}) rotate(${mid.toFixed(2)}) translate(${-size / 2} ${-size / 2})">
      <svg width="${size}" height="${size}" viewBox="0 0 48 48" overflow="visible">${ICONS[kind]}</svg>
    </g>`;
  }

  let rim = "";
  const bulbs = 28;
  for (let i = 0; i < bulbs; i++) {
    const [bx, by] = polar(cx, cy, R + 13, (360 / bulbs) * i);
    rim += `<circle cx="${bx.toFixed(2)}" cy="${by.toFixed(2)}" r="9" fill="rgba(255,224,160,.35)" class="rim-bulb" style="animation-delay:${(i * 0.09).toFixed(2)}s"/>`;
    rim += `<circle cx="${bx.toFixed(2)}" cy="${by.toFixed(2)}" r="3.2" fill="#fff0c4" class="rim-bulb" style="animation-delay:${(i * 0.09).toFixed(2)}s"/>`;
  }

  svg.innerHTML = defs + `
    <circle cx="${cx}" cy="${cy}" r="${R + 24}" fill="url(#rimGrad)"/>
    <circle cx="${cx}" cy="${cy}" r="${R + 20}" fill="none" stroke="rgba(255,232,180,.85)" stroke-width="2"/>
    <g id="wheelSpin">
      <circle cx="${cx}" cy="${cy}" r="${R}" fill="#12291a"/>
      ${segs}
      ${icons}
      <circle cx="${cx}" cy="${cy}" r="${R}" fill="url(#wheelShade)" pointer-events="none"/>
    </g>
    ${rim}
  `;
}

function spinTo(index, n) {
  const seg = 360 / n;
  const center = index * seg + seg / 2;
  const base = state.wheelAngle - (state.wheelAngle % 360);
  const target = base + 360 * 5 + ((360 - center) % 360);
  state.wheelAngle = target;
  const el = document.getElementById("wheelSpin");
  if (!el) return;
  el.style.transition = "transform 4.6s cubic-bezier(.16,.86,.06,1)";
  el.style.transform = `rotate(${target}deg)`;
}

/* ================= РЕНДЕР ================= */
function renderAll() {
  const d = state.data;
  if (!d) return;

  const points = d.user ? d.user.points : 0;
  const cost = d.spin_cost || 100;

  $("helloTitle").textContent = `Привет, ${(d.user && d.user.name) || "друг"}! 💗`;
  const camp = d.campaign || {};
  $("helloText").textContent = camp.active
    ? "Кампания идёт: баллы начисляются за комментарии"
    : "Кампания сейчас не идёт: баллы пока не начисляются";

  $("pointsVal").textContent = points;
  $("spinCost").textContent = cost;

  const pct = Math.max(0, Math.min(100, Math.round((points / cost) * 100)));
  $("pointsBar").style.width = pct + "%";

  const left = Math.max(0, cost - points);
  $("pointsHint").innerHTML = left > 0
    ? `Ещё <b>${left}</b> ${plural(left, "балл", "балла", "баллов")}, и можно крутить колесо`
    : `Можно крутить колесо! Хватит на <b>${Math.floor(points / cost)}</b> ${plural(Math.floor(points / cost), "вращение", "вращения", "вращений")}`;

  const c = d.counts || {};
  $("cWeek").textContent = c.week || 0;
  $("cMonth").textContent = c.month || 0;
  $("cAll").textContent = c.all || 0;

  state.prizes = d.prizes || [];
  renderWheel(state.prizes);
  renderPrizes();
  renderTop();

  const btn = $("spinBtn");
  btn.textContent = `Крутить колесо — ${cost} ${plural(cost, "балл", "балла", "баллов")}`;
  btn.disabled = points < cost || state.spinning;

  if (d.daily_bonus > 0) {
    toast(`+${d.daily_bonus} ${plural(d.daily_bonus, "балл", "балла", "баллов")} за сегодняшний вход 🎁`);
  }
}

function renderPrizes() {
  const box = $("prizeList");
  const list = state.prizes;
  if (!list.length) { box.innerHTML = `<div class="empty">Призы пока не добавлены.</div>`; return; }
  box.innerHTML = list.map((p, i) => {
    const kind = iconByIndex(i);
    const name = stripEmoji(p.name) || "Приз";
    const detail = stripEmoji(p.detail);
    return `<div class="prize-row">
      <span class="prize-ico">${ICONS[kind]}</span>
      <span class="prize-name">${escapeHtml(name)}${detail ? ` — <em>${escapeHtml(detail)}</em>` : ""}
        ${p.stock > 0 ? `<span class="prize-stock"> · осталось ${p.stock}</span>` : ""}</span>
    </div>`;
  }).join("");
}

function renderTop() {
  const box = $("topList");
  const rows = (state.data && state.data.top && state.data.top[state.period]) || [];
  if (!rows.length) { box.innerHTML = `<div class="empty">Пока нет данных.</div>`; return; }
  const medal = ["🥇", "🥈", "🥉"];
  box.innerHTML = rows.map((r, i) => `
    <div class="top-row${r.me ? " me" : ""}">
      <span class="top-pos">${medal[i] || i + 1}</span>
      <span class="top-name">${escapeHtml(r.name)}</span>
      <span class="top-c">${r.count}</span>
    </div>`).join("");
}

function plural(n, one, few, many) {
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b > 1 && b < 5) return few;
  if (b === 1) return one;
  return many;
}

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
}

let toastTimer = null;
function toast(msg) {
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("on"), 3200);
}

function showModal(ico, title, text) {
  $("modalIco").textContent = ico;
  $("modalTitle").textContent = title;
  $("modalText").textContent = text;
  $("modal").classList.add("on");
}

async function load() {
  if (PREVIEW) {
    state.data = previewData();
    renderAll();
    return;
  }
  try {
    const d = await api("/api/me", { initData });
    if (d.error) { toast("Не удалось авторизоваться"); return; }
    state.data = d;
    renderAll();
  } catch (e) {
    toast("Не получилось загрузить данные");
  }
}

async function doSpin() {
  if (state.spinning) return;
  const d = state.data;
  if (!d) return;
  const cost = d.spin_cost || 100;
  if ((d.user.points || 0) < cost) { toast("Не хватает баллов"); return; }

  state.spinning = true;
  $("spinBtn").disabled = true;

  if (PREVIEW) {
    const n = Math.max(state.prizes.length, 1);
    const idx = Math.floor(Math.random() * n);
    spinTo(idx, n);
    setTimeout(() => {
      state.spinning = false;
      $("spinBtn").disabled = false;
      const p = state.prizes[idx];
      showModal("🎉", "Демо-режим", `Выпало: ${p ? stripEmoji(p.name) : "—"}. В Telegram здесь будет настоящий приз.`);
    }, 4800);
    return;
  }

  try {
    const r = await api("/api/spin", { initData });
    if (r.error) {
      state.spinning = false;
      $("spinBtn").disabled = false;
      toast(r.message || "Не удалось крутить");
      return;
    }
    const list = r.prizes || state.prizes;
    const n = Math.max(list.length, 1);
    const idx = Math.max(0, list.findIndex((p) => p.id === (r.prize && r.prize.id)));
    spinTo(idx, n);

    setTimeout(() => {
      state.spinning = false;
      if (r.points != null && state.data) state.data.user.points = r.points;
      if (r.prizes) state.prizes = r.prizes;
      renderAll();
      const name = stripEmoji(r.prize ? r.prize.name : "") || "Приз";
      const bonus = r.nothing_bonus ? ` Начислено +${r.nothing_bonus} баллов.` : "";
      showModal("🎉", "Поздравляем!", `Вам выпало: ${name}.${bonus} Остаток баллов: ${r.points}.`);
    }, 4800);
  } catch (e) {
    state.spinning = false;
    $("spinBtn").disabled = false;
    toast("Ошибка сети, попробуйте ещё раз");
  }
}

$("spinBtn").addEventListener("click", doSpin);
$("hub").addEventListener("click", doSpin);
$("modalClose").addEventListener("click", () => $("modal").classList.remove("on"));
$("modal").addEventListener("click", (e) => { if (e.target.id === "modal") $("modal").classList.remove("on"); });

document.querySelectorAll(".tab").forEach((tab) => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach((t) => t.classList.remove("on"));
    tab.classList.add("on");
    state.period = tab.dataset.period;
    renderTop();
  });
});

buildTree();
buildBottom();
startSnow();
load();
</script>
