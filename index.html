<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b1a12" />
<title>Full Bak Points</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --pine-1:#0a1a12;
    --pine-2:#0f2418;
    --pine-3:#143020;
    --cream:#f3ead8;
    --cream-dim:rgba(243,234,216,.62);
    --gold:#f6c453;
    --gold-soft:#e8b64a;
    --red-1:#8e1b1b;
    --red-2:#b32222;
    --red-3:#d33a2c;
    --glass:rgba(18,44,30,.62);
    --glass-2:rgba(12,32,22,.55);
    --stroke:rgba(246,196,83,.28);
    --stroke-soft:rgba(255,255,255,.10);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0; padding:0;
    height:100%;
    background:#08130d;
    color:var(--cream);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    overscroll-behavior:none;
    -webkit-font-smoothing:antialiased;
  }

  #bg{
    position:fixed; inset:0; z-index:0;
    overflow:hidden;
    background:
      radial-gradient(120% 70% at 50% 0%, #1b3a26 0%, #102619 42%, #08160f 78%, #050d09 100%);
  }
  #bg::after{
    content:"";
    position:absolute; inset:0;
    background:radial-gradient(90% 60% at 50% 42%, rgba(0,0,0,0) 40%, rgba(0,0,0,.55) 100%);
    pointer-events:none;
  }
  #treeLayer{ position:absolute; inset:0; width:100%; height:100%; }
  #snowCanvas{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  #bottomLayer{
    position:absolute; left:0; right:0; bottom:0;
    height:min(46vh, 380px);
    pointer-events:none;
  }

  .bulb{ animation:bulbTwinkle 3.2s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  @keyframes bulbTwinkle{
    0%,100%{ opacity:.35; filter:drop-shadow(0 0 2px rgba(255,214,140,.35)); }
    45%{ opacity:1; filter:drop-shadow(0 0 9px rgba(255,214,140,.95)); }
    60%{ opacity:.85; filter:drop-shadow(0 0 6px rgba(255,214,140,.7)); }
  }

  #app{
    position:fixed; inset:0; z-index:2;
    overflow-y:auto; overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    padding:
      calc(env(safe-area-inset-top, 0px) + 14px)
      16px
      calc(env(safe-area-inset-bottom, 0px) + 250px);
    scrollbar-width:none;
  }
  #app::-webkit-scrollbar{ display:none; }

  .wrap{ max-width:460px; margin:0 auto; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px; margin-bottom:14px;
  }
  .iconbtn{
    width:44px; height:44px; flex:0 0 44px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.10);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    color:var(--cream);
    display:flex; align-items:center; justify-content:center;
    font-size:19px; line-height:1; cursor:pointer;
    transition:transform .15s ease, background .2s ease;
  }
  .iconbtn:active{ transform:scale(.93); background:rgba(255,255,255,.18); }

  .brand{
    flex:1 1 auto; text-align:center;
    padding:9px 14px;
    border-radius:16px;
    border:1px solid rgba(246,196,83,.30);
    background:linear-gradient(180deg, rgba(30,64,44,.85), rgba(14,36,24,.85));
    box-shadow:0 8px 22px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.07);
  }
  .brand b{ display:block; font-size:16px; font-weight:600; letter-spacing:.2px; }
  .brand span{ display:block; font-size:11px; color:var(--cream-dim); margin-top:1px; }

  .card{
    border-radius:22px;
    border:1px solid var(--stroke);
    background:linear-gradient(180deg, rgba(22,52,35,.80), rgba(10,28,19,.80));
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    box-shadow:0 14px 34px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.06);
    padding:16px;
    margin-bottom:14px;
  }

  .hello{
    background:linear-gradient(150deg, var(--red-3) 0%, var(--red-2) 45%, var(--red-1) 100%);
    border-color:rgba(255,180,150,.35);
    box-shadow:0 16px 36px rgba(120,10,10,.45), inset 0 1px 0 rgba(255,255,255,.18);
    position:relative; overflow:hidden;
  }
  .hello::before{
    content:"";
    position:absolute; inset:0;
    background:radial-gradient(120% 90% at 85% -10%, rgba(255,255,255,.22), rgba(255,255,255,0) 60%);
    pointer-events:none;
  }
  .hello h1{
    margin:0 0 8px;
    font-family:Georgia,"Times New Roman",serif;
    font-size:25px; font-weight:600; line-height:1.2;
    text-shadow:0 2px 10px rgba(0,0,0,.35);
  }
  .hello p{ margin:0; font-size:13.5px; line-height:1.45; color:rgba(255,240,232,.92); }
  .hello .flake{
    position:absolute; right:14px; top:50%; transform:translateY(-50%);
    opacity:.35; pointer-events:none;
  }

  .points{
    padding:0;
    overflow:hidden;
  }
  .points-top{
    display:flex; align-items:flex-start; justify-content:space-between;
    gap:12px; padding:16px 16px 0;
  }
  .points-label{ font-size:13px; color:var(--cream-dim); margin-bottom:2px; }
  .points-value{
    display:flex; align-items:center; gap:8px;
    font-size:40px; font-weight:700; line-height:1;
    letter-spacing:-1px;
    text-shadow:0 4px 18px rgba(0,0,0,.45);
  }
  .points-value .heart{ font-size:22px; filter:drop-shadow(0 0 8px rgba(255,60,90,.6)); }
  .points-cost{
    text-align:right; font-size:13px; color:var(--cream-dim);
    padding-top:6px; white-space:nowrap;
  }
  .points-cost b{ color:var(--gold); font-weight:600; }

  .points-mid{
    display:flex; align-items:center; gap:12px;
    padding:14px 16px 0;
  }
  .gift-ico{ flex:0 0 auto; filter:drop-shadow(0 6px 10px rgba(0,0,0,.5)); }
  .bar{
    flex:1 1 auto; height:14px; border-radius:99px;
    background:rgba(0,0,0,.42);
    border:1px solid rgba(255,255,255,.10);
    overflow:hidden;
    box-shadow:inset 0 2px 6px rgba(0,0,0,.5);
  }
  .bar > i{
    display:block; height:100%; width:0%;
    border-radius:99px;
    background:linear-gradient(90deg, #f6c453, #ffdf8a 55%, #f6c453);
    box-shadow:0 0 14px rgba(246,196,83,.65);
    transition:width .8s cubic-bezier(.2,.9,.2,1);
  }
  .points-hint{
    padding:12px 16px 16px;
    font-size:12.5px; color:var(--cream-dim);
    border-top:1px solid rgba(255,255,255,.06);
    margin-top:14px;
  }
  .points-hint b{ color:var(--cream); }

  .card-title{
    display:flex; align-items:center; gap:7px;
    font-size:14px; font-weight:600; margin-bottom:12px;
  }
  .stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
  .stat{
    border-radius:15px;
    border:1px solid rgba(255,255,255,.10);
    background:rgba(255,255,255,.055);
    padding:11px 6px 9px;
    text-align:center;
  }
  .stat b{ display:block; font-size:22px; font-weight:700; line-height:1.1; }
  .stat span{ display:block; font-size:10.5px; color:var(--cream-dim); margin-top:3px; }

  .ribbon{
    position:relative;
    margin:20px auto 12px;
    max-width:330px;
    text-align:center;
    padding:9px 26px;
    font-family:Georgia,"Times New Roman",serif;
    font-size:17px; letter-spacing:.3px;
    color:#ffe9c9;
    background:linear-gradient(180deg, #a51f1f, #7d1414);
    border:1px solid rgba(246,196,83,.55);
    border-radius:10px;
    box-shadow:0 10px 26px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.16);
  }
  .ribbon::before,.ribbon::after{
    content:"";
    position:absolute; top:50%; width:22px; height:22px;
    background:linear-gradient(180deg,#a51f1f,#7d1414);
    border:1px solid rgba(246,196,83,.5);
    transform:translateY(-50%) rotate(45deg);
    border-radius:4px;
    z-index:-1;
  }
  .ribbon::before{ left:-11px; }
  .ribbon::after{ right:-11px; }
  .ribbon .snow{ opacity:.85; margin:0 6px; }

  .wheel-box{
    position:relative;
    width:min(88vw, 380px);
    margin:0 auto 6px;
    aspect-ratio:1/1;
  }
  #wheelSvg{ width:100%; height:100%; display:block; }
  #wheelSpin{
    transform-origin:50% 50%;
    transform:rotate(0deg);
    will-change:transform;
  }
  .rim-bulb{ animation:rimTwinkle 2.4s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  @keyframes rimTwinkle{
    0%,100%{ opacity:.45; }
    50%{ opacity:1; }
  }
  .hub{
    position:absolute; left:50%; top:50%;
    width:19%; height:19%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    border:none; padding:0;
    background:radial-gradient(circle at 35% 30%, #fff 0%, #ffe9ea 45%, #f3c9cc 100%);
    box-shadow:0 0 0 3px rgba(246,196,83,.55), 0 10px 26px rgba(0,0,0,.55);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:transform .15s ease;
  }
  .hub:active{ transform:translate(-50%,-50%) scale(.94); }
  .hub svg{ width:52%; height:52%; }

  .spin-btn{
    display:block; width:100%;
    margin:14px 0 6px;
    padding:16px;
    border-radius:18px;
    border:1px solid rgba(246,196,83,.55);
    background:linear-gradient(180deg, #d33a2c, #8e1b1b);
    color:#fff6ea;
    font-size:16px; font-weight:600; letter-spacing:.2px;
    box-shadow:0 14px 30px rgba(120,10,10,.45), inset 0 1px 0 rgba(255,255,255,.22);
    cursor:pointer;
    transition:transform .15s ease, filter .2s ease;
  }
  .spin-btn:active{ transform:scale(.985); filter:brightness(1.08); }
  .spin-btn:disabled{ opacity:.55; cursor:default; }

  .prize-row{
    display:flex; align-items:center; gap:10px;
    padding:10px 0;
    border-bottom:1px solid rgba(255,255,255,.07);
    font-size:13.5px;
  }
  .prize-row:last-child{ border-bottom:none; }
  .prize-ico{ flex:0 0 30px; width:30px; height:30px; display:flex; align-items:center; justify-content:center; }
  .prize-ico svg{ width:100%; height:100%; }
  .prize-name{ flex:1 1 auto; min-width:0; word-break:break-word; line-height:1.35; }
  .prize-name em{ font-style:normal; color:var(--cream-dim); }
  .prize-pc{ flex:0 0 auto; color:var(--gold); font-weight:600; font-size:13px; }
  .prize-stock{ font-size:11px; color:var(--cream-dim); }

  .tabs{ display:flex; gap:6px; margin-bottom:12px; }
  .tab{
    flex:1 1 0; padding:9px 4px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.10);
    background:rgba(255,255,255,.05);
    color:var(--cream-dim);
    font-size:12.5px; cursor:pointer;
    transition:.2s;
  }
  .tab.on{
    background:linear-gradient(180deg, rgba(246,196,83,.22), rgba(246,196,83,.10));
    border-color:rgba(246,196,83,.5);
    color:var(--cream);
  }
  .top-row{
    display:flex; align-items:center; gap:10px;
    padding:9px 0; font-size:13.5px;
    border-bottom:1px solid rgba(255,255,255,.06);
  }
  .top-row:last-child{ border-bottom:none; }
  .top-row.me{ color:var(--gold); }
  .top-pos{ flex:0 0 24px; text-align:center; font-weight:700; color:var(--cream-dim); }
  .top-name{ flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .top-c{ flex:0 0 auto; font-weight:600; }

  .empty{ font-size:13px; color:var(--cream-dim); padding:6px 0; }

  .modal{
    position:fixed; inset:0; z-index:20;
    display:none; align-items:center; justify-content:center;
    padding:24px;
    background:rgba(3,10,6,.72);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  }
  .modal.on{ display:flex; }
  .modal-card{
    width:100%; max-width:330px;
    border-radius:24px;
    border:1px solid rgba(246,196,83,.45);
    background:linear-gradient(180deg, rgba(28,62,42,.98), rgba(10,26,18,.98));
    box-shadow:0 24px 60px rgba(0,0,0,.6);
    padding:24px 20px;
    text-align:center;
    animation:pop .35s cubic-bezier(.2,1.2,.4,1);
  }
  @keyframes pop{ from{ transform:scale(.86); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .modal-card .big{ font-size:52px; line-height:1; margin-bottom:10px; }
  .modal-card h3{ margin:0 0 6px; font-family:Georgia,serif; font-size:20px; font-weight:600; }
  .modal-card p{ margin:0 0 18px; font-size:13.5px; color:var(--cream-dim); line-height:1.45; }
  .modal-card button{
    width:100%; padding:14px; border-radius:14px; border:none;
    background:linear-gradient(180deg,#d33a2c,#8e1b1b);
    color:#fff6ea; font-size:15px; font-weight:600; cursor:pointer;
  }

  .toast{
    position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 26px);
    transform:translate(-50%, 20px);
    z-index:30;
    padding:12px 18px;
    border-radius:14px;
    background:rgba(20,44,30,.96);
    border:1px solid rgba(246,196,83,.45);
    color:var(--cream); font-size:13.5px;
    box-shadow:0 12px 30px rgba(0,0,0,.5);
    opacity:0; pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    max-width:88vw; text-align:center;
  }
  .toast.on{ opacity:1; transform:translate(-50%,0); }

  .preview-badge{
    position:fixed; top:calc(env(safe-area-inset-top,0px) + 6px); left:50%;
    transform:translateX(-50%);
    z-index:40;
    font-size:10.5px; letter-spacing:.4px; text-transform:uppercase;
    padding:4px 10px; border-radius:99px;
    background:rgba(246,196,83,.18);
    border:1px solid rgba(246,196,83,.45);
    color:var(--gold);
    display:none;
  }
  .preview-badge.on{ display:block; }

  @media (prefers-reduced-motion: reduce){
    .bulb,.rim-bulb{ animation:none; opacity:.85; }
  }
</style>
</head>
<body>

<div id="bg">
  <svg id="treeLayer" preserveAspectRatio="xMidYMid slice" viewBox="0 0 390 844" aria-hidden="true"></svg>
  <canvas id="snowCanvas" aria-hidden="true"></canvas>
  <svg id="bottomLayer" preserveAspectRatio="xMidYMax slice" viewBox="0 0 390 300" aria-hidden="true"></svg>
</div>

<div class="preview-badge" id="previewBadge">предпросмотр</div>

<div id="app">
  <div class="wrap">

    <div class="topbar">
      <button class="iconbtn" id="btnClose" aria-label="Закрыть">✕</button>
      <div class="brand">
        <b>Full Bak Points</b>
        <span>мини-приложение</span>
      </div>
      <button class="iconbtn" id="btnMore" aria-label="Ещё">⋯</button>
    </div>

    <div class="card hello">
      <h1 id="helloTitle">Привет! 💗</h1>
      <p id="helloText">Загружаем данные…</p>
      <svg class="flake" width="46" height="46" viewBox="0 0 48 48" fill="none" stroke="rgba(255,255,255,.9)" stroke-width="1.6" stroke-linecap="round">
        <path d="M24 6v36M8 15l32 18M40 15L8 33"/>
        <path d="M24 11l-4 4M24 11l4 4M24 37l-4-4M24 37l4-4M11 19l1 5M11 29l1-5M37 19l-1 5M37 29l-1-5"/>
      </svg>
    </div>

    <div class="card points">
      <div class="points-top">
        <div>
          <div class="points-label">Твои баллы</div>
          <div class="points-value">
            <span id="pointsVal">0</span>
            <span class="heart">💗</span>
          </div>
        </div>
        <div class="points-cost">
          Вращение — <b><span id="spinCost">100</span> баллов</b>
        </div>
      </div>

      <div class="points-mid">
        <svg class="gift-ico" width="34" height="34" viewBox="0 0 48 48" aria-hidden="true">
          <defs>
            <linearGradient id="pg1" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#e04b3a"/><stop offset="1" stop-color="#8e1b1b"/>
            </linearGradient>
          </defs>
          <ellipse cx="24" cy="43" rx="15" ry="3.4" fill="rgba(0,0,0,.45)"/>
          <rect x="9" y="19" width="30" height="22" rx="3" fill="url(#pg1)"/>
          <rect x="9" y="19" width="30" height="6" rx="3" fill="#f0c05a"/>
          <rect x="21" y="19" width="6" height="22" fill="#f6d365"/>
          <path d="M24 19c-6.5 0-11-3-11-6.2S19.5 9 24 19c4.5-10 11-9.2 11-6.2S30.5 19 24 19z" fill="#f6d365"/>
        </svg>
        <div class="bar"><i id="pointsBar"></i></div>
      </div>

      <div class="points-hint" id="pointsHint">Ещё <b>100</b> баллов, и можно крутить колесо</div>
    </div>

    <div class="card">
      <div class="card-title">💗 Твои комментарии</div>
      <div class="stats">
        <div class="stat"><b id="cWeek">0</b><span>за 7 дней</span></div>
        <div class="stat"><b id="cMonth">0</b><span>за 30 дней</span></div>
        <div class="stat"><b id="cAll">0</b><span>всего</span></div>
      </div>
    </div>

    <div class="ribbon">
      <span class="snow">❄</span> Колесо призов <span class="snow">❄</span>
    </div>

    <div class="wheel-box">
      <svg id="wheelSvg" viewBox="0 0 400 400" aria-hidden="true"></svg>
      <button class="hub" id="hub" aria-label="Крутить">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path d="M24 41s-13-8.2-13-17.2A7.8 7.8 0 0 1 24 18a7.8 7.8 0 0 1 13 5.8C37 32.8 24 41 24 41z" fill="#d33a2c"/>
          <path d="M24 38s-10-6.6-10-13.6A6 6 0 0 1 24 20a6 6 0 0 1 10 4.4C34 31.4 24 38 24 38z" fill="#f26a5c" opacity=".55"/>
        </svg>
      </button>
    </div>

    <button class="spin-btn" id="spinBtn">Крутить колесо — 100 баллов</button>

    <div class="card">
      <div class="card-title">🎁 Призы и шансы</div>
      <div id="prizeList"><div class="empty">Загружаем…</div></div>
    </div>

    <div class="card">
      <div class="card-title">🏆 Самые активные</div>
      <div class="tabs">
        <button class="tab on" data-period="week">7 дней</button>
        <button class="tab" data-period="month">30 дней</button>
        <button class="tab" data-period="all">Всё время</button>
      </div>
      <div id="topList"><div class="empty">Загружаем…</div></div>
    </div>

  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-card">
    <div class="big" id="modalIco">🎉</div>
    <h3 id="modalTitle">Поздравляем!</h3>
    <p id="modalText"></p>
    <button id="modalClose">Отлично</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = "https://tg-activity-bot.katka-69.workers.dev";

const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor("#0b1a12"); tg.setBackgroundColor && tg.setBackgroundColor("#0b1a12"); } catch(e){} }

const initData = tg && tg.initData ? tg.initData : "";
const PREVIEW = !initData;

const $ = (id) => document.getElementById(id);

const state = {
  data: null,
  period: "week",
  spinning: false,
  wheelAngle: 0,
  prizes: [],
};

async function api(path, body) {
  const res = await fetch(API + path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body || {}),
  });
  return res.json();
}

function previewData() {
  return {
    user: { id: 1, name: "@pln_bak", points: 0 },
    daily_bonus: 0,
    counts: { week: 0, month: 0, all: 0 },
    spin_cost: 100,
    campaign: { active: false, start: 0, end: 0, now: 0, season: 1 },
    top: {
      week: [{ name: "@anya", count: 12, me: false }, { name: "@pln_bak", count: 7, me: true }, { name: "@mira", count: 4, me: false }],
      month: [{ name: "@anya", count: 41, me: false }, { name: "@pln_bak", count: 28, me: true }],
      all: [{ name: "@anya", count: 96, me: false }, { name: "@pln_bak", count: 61, me: true }],
    },
    prizes: [
      { id: 1, name: "🎁", chance: 20, stock: 5, detail: "Промокод на 10% на любой заказ" },

function iconFor(prize, index) {
  const n = String(prize.name || "").toLowerCase();
  const d = String(prize.detail || "").toLowerCase();
  const s = n + " " + d;
  if (/\+50|бонус|утешит|coin|монет/.test(s)) return "coin";
  if (/промокод|скидк|подар|gift|🎁/.test(s)) return "gift";
  if (/конфет|candy|карамел|🍬|леден/.test(s)) return "candy";
  if (/снеж|snow|❄|❅|❆/.test(s)) return "snow";
  if (/звезд|star|⭐|🌟/.test(s)) return "star";
  if (/колокол|bell|🔔/.test(s)) return "bell";
  if (/сердц|heart|💗|❤/.test(s)) return "heart";
  if (/ёлк|елк|tree|🎄|ель/.test(s)) return "tree";
  if (/шар|ball|игрушк|🎈/.test(s)) return "ball";
  if (/печен|cookie|пряник|🍪/.test(s)) return "cookie";
  if (/искр|sparkle|✨|блеск/.test(s)) return "sparkle";
  if (/свеч|candle|фонар|🕯/.test(s)) return "candle";
  if (/вареж|mitten|рукавиц|🧤/.test(s)) return "mitten";
  return ICON_ORDER[index % ICON_ORDER.length];
}

function buildTree() {
  const svg = $("treeLayer");
  const W = 390, H = 844;
  let defs = `
    <defs>
      <linearGradient id="pineA" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#1c4a30"/><stop offset="1" stop-color="#0a1d13"/>
      </linearGradient>
      <linearGradient id="pineB" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#245c3b"/><stop offset="1" stop-color="#0d2417"/>
      </linearGradient>
      <radialGradient id="bulbGlow"><stop offset="0" stop-color="#ffe9b0" stop-opacity=".95"/><stop offset="1" stop-color="#ffcf6b" stop-opacity="0"/></radialGradient>
    </defs>`;

  let body = "";

  const frond = (x, y, rot, sc, fill) =>
    `<path d="M0 0 C 14 -7 30 -6 46 -1 C 30 4 14 6 0 0 Z"
      transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot.toFixed(1)}) scale(${sc.toFixed(2)})"
      fill="${fill}" opacity=".95"/>`;

  const snowCap = (x, y, rot, sc) =>
    `<path d="M2 -1 C 14 -6 30 -5 44 -1 C 30 0.5 14 1.5 2 -1 Z"
      transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot.toFixed(1)}) scale(${sc.toFixed(2)})"
      fill="rgba(235,245,255,.55)"/>`;

  for (let y = -10; y < H + 20; y += 24) {
    const wob = Math.sin(y / 42) * 6;
    const sc = 0.75 + ((Math.sin(y / 30) + 1) / 2) * 0.55;
    const rot = -18 + Math.sin(y / 55) * 14;
    body += frond(-16 + wob, y, rot, sc, "url(#pineA)");
    body += snowCap(-16 + wob, y, rot, sc);
    body += frond(W + 16 - wob, y, 180 - rot, sc, "url(#pineB)");
    body += snowCap(W + 16 - wob, y, 180 - rot, sc);
  }

  for (let i = 0; i < 6; i++) {
    body += frond(-10 + i * 3, 30 + i * 16, -30 + i * 4, 1.15, "url(#pineB)");
    body += frond(W + 10 - i * 3, 26 + i * 16, 210 - i * 4, 1.15, "url(#pineA)");
  }

  const colors = ["#ffd98a", "#ffe9b0", "#ffc46b", "#fff2cc"];
  let bulbs = "";
  let k = 0;
  for (let y = 40; y < H - 40; y += 46) {
    const xL = 22 + Math.sin(y / 38) * 10;
    const xR = W - 22 - Math.sin(y / 44) * 10;
    const cL = colors[k % colors.length];
    const cR = colors[(k + 2) % colors.length];
    bulbs += `<circle cx="${xL.toFixed(1)}" cy="${y}" r="13" fill="url(#bulbGlow)" class="bulb" style="animation-delay:${(k * 0.31).toFixed(2)}s"/>`;
    bulbs += `<circle cx="${xL.toFixed(1)}" cy="${y}" r="3.1" fill="${cL}" class="bulb" style="animation-delay:${(k * 0.31).toFixed(2)}s"/>`;
    bulbs += `<circle cx="${xR.toFixed(1)}" cy="${y + 14}" r="13" fill="url(#bulbGlow)" class="bulb" style="animation-delay:${(k * 0.27 + 0.9).toFixed(2)}s"/>`;
    bulbs += `<circle cx="${xR.toFixed(1)}" cy="${y + 14}" r="3.1" fill="${cR}" class="bulb" style="animation-delay:${(k * 0.27 + 0.9).toFixed(2)}s"/>`;
    k++;
  }

  svg.innerHTML = defs + body + bulbs;
}

function startSnow() {
  const cv = $("snowCanvas");
  const ctx = cv.getContext("2d");
  let W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
  let flakes = [], glints = [];

  function resize() {
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.floor(W * dpr); cv.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round((W * H) / 14000);
    flakes = Array.from({ length: Math.min(Math.max(n, 40), 130) }, () => newFlake(true));
    glints = Array.from({ length: 34 }, () => newGlint(true));
  }

  function newFlake(init) {
    return {
      x: Math.random() * W,
      y: init ? Math.random() * H : -10,
      r: 0.7 + Math.random() * 2.1,
      vy: 0.18 + Math.random() * 0.55,
      vx: (Math.random() - 0.5) * 0.22,
      ph: Math.random() * Math.PI * 2,
      sp: 0.4 + Math.random() * 0.9,
      a: 0.35 + Math.random() * 0.5,
    };
  }

  function newGlint(init) {
    return {
      x: Math.random() * W,
      y: init ? Math.random() * H : -10,
      r: 0.6 + Math.random() * 1.4,
      vy: 0.10 + Math.random() * 0.32,
      vx: (Math.random() - 0.5) * 0.35,
      ph: Math.random() * Math.PI * 2,
      sp: 1.4 + Math.random() * 2.2,
    };
  }

  let t = 0;
  function frame() {
    t += 0.016;
    ctx.clearRect(0, 0, W, H);

    for (const f of flakes) {
      f.y += f.vy;
      f.x += f.vx + Math.sin(t * f.sp + f.ph) * 0.28;
      if (f.y > H + 8) Object.assign(f, newFlake(false));
      if (f.x < -8) f.x = W + 8;
      if (f.x > W + 8) f.x = -8;
      const tw = 0.72 + 0.28 * Math.sin(t * f.sp * 1.7 + f.ph);
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(240,248,255,${(f.a * tw).toFixed(3)})`;
      ctx.fill();
    }

    for (const g of glints) {
      g.y += g.vy;
      g.x += g.vx + Math.sin(t * 0.7 + g.ph) * 0.18;
      if (g.y > H + 8) Object.assign(g, newGlint(false));
      if (g.x < -8) g.x = W + 8;
      if (g.x > W + 8) g.x = -8;
      const k = Math.max(0, Math.sin(t * g.sp + g.ph));
      if (k < 0.05) continue;
      const r = g.r * (0.6 + k * 1.5);
      const grad = ctx.createRadialGradient(g.x, g.y, 0, g.x, g.y, r * 4);
      grad.addColorStop(0, `rgba(255,240,200,${(0.85 * k).toFixed(3)})`);
      grad.addColorStop(1, "rgba(255,220,150,0)");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(g.x, g.y, r * 4, 0, Math.PI * 2);
      ctx.fill();
    }

    requestAnimationFrame(frame);
  }

  resize();
  window.addEventListener("resize", resize);
  requestAnimationFrame(frame);
}

    <defs>
      <radialGradient id="rimGrad" cx="50%" cy="50%" r="50%">
        <stop offset="86%" stop-color="#3a2410"/>
        <stop offset="100%" stop-color="#1b1006"/>
      </radialGradient>
      <radialGradient id="wheelShade" cx="42%" cy="34%" r="72%">
        <stop offset="0" stop-color="rgba(255,255,255,.16)"/>
        <stop offset="60%" stop-color="rgba(0,0,0,0)"/>
        <stop offset="100%" stop-color="rgba(0,0,0,.42)"/>
      </radialGradient>
    </defs>`;

  let segs = "";
  for (let i = 0; i < n; i++) {
    const a0 = i * seg, a1 = (i + 1) * seg;
    const [x0, y0] = polar(cx, cy, R, a0);
    const [x1, y1] = polar(cx, cy, R, a1);
    const large = seg > 180 ? 1 : 0;
    const fill = SEG_FILL[i % SEG_FILL.length];
    segs += `<path d="M${cx} ${cy} L${x0.toFixed(2)} ${y0.toFixed(2)} A${R} ${R} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z"
      fill="${fill}" stroke="rgba(0,0,0,.22)" stroke-width="1"/>`;
  }

  let icons = "";
  for (let i = 0; i < n; i++) {
    const mid = i * seg + seg / 2;
    const [ix, iy] = polar(cx, cy, R * 0.66, mid);
    const kind = iconFor(prizes[i] || {}, i);
    const size = Math.min(46, Math.max(30, 210 / n + 22));
    icons += `<g transform="translate(${ix.toFixed(2)} ${iy.toFixed(2)}) rotate(${mid.toFixed(2)}) translate(${-size / 2} ${-size / 2})">
      <svg width="${size}" height="${size}" viewBox="0 0 48 48" overflow="visible">${ICONS[kind] || ICONS.snow}</svg>
    </g>`;
  }

  let rim = "";
  const bulbs = 24;
  for (let i = 0; i < bulbs; i++) {
    const [bx, by] = polar(cx, cy, R + 12, (360 / bulbs) * i);
    rim += `<circle cx="${bx.toFixed(2)}" cy="${by.toFixed(2)}" r="6.5" fill="rgba(255,214,140,.28)" class="rim-bulb" style="animation-delay:${(i * 0.11).toFixed(2)}s"/>`;
    rim += `<circle cx="${bx.toFixed(2)}" cy="${by.toFixed(2)}" r="2.8" fill="#ffe6ad" class="rim-bulb" style="animation-delay:${(i * 0.11).toFixed(2)}s"/>`;
  }

  svg.innerHTML = defs + `
    <circle cx="${cx}" cy="${cy}" r="${R + 22}" fill="url(#rimGrad)"/>
    <circle cx="${cx}" cy="${cy}" r="${R + 18}" fill="none" stroke="rgba(246,196,83,.55)" stroke-width="2"/>
    <g id="wheelSpin">
      <circle cx="${cx}" cy="${cy}" r="${R}" fill="#0b2417"/>
      ${segs}
      ${icons}
      <circle cx="${cx}" cy="${cy}" r="${R}" fill="url(#wheelShade)" pointer-events="none"/>
    </g>
    ${rim}
  `;
}

function spinTo(index, n) {
  const seg = 360 / n;
  const center = index * seg + seg / 2;
  const base = state.wheelAngle - (state.wheelAngle % 360);
  const target = base + 360 * 5 + ((360 - center) % 360);
  state.wheelAngle = target;
  const el = document.getElementById("wheelSpin");
  if (!el) return;
  el.style.transition = "transform 4.6s cubic-bezier(.16,.86,.06,1)";
  el.style.transform = `rotate(${target}deg)`;
}

function renderAll() {
  const d = state.data;
  if (!d) return;

  const points = d.user ? d.user.points : 0;
  const cost = d.spin_cost || 100;

  $("helloTitle").textContent = `Привет, ${(d.user && d.user.name) || "друг"}! 💗`;
  const camp = d.campaign || {};
  $("helloText").textContent = camp.active
    ? "Кампания идёт: баллы начисляются за комментарии"
    : "Кампания сейчас не идёт: баллы пока не начисляются";

  $("pointsVal").textContent = points;
  $("spinCost").textContent = cost;

  const pct = Math.max(0, Math.min(100, Math.round((points / cost) * 100)));
  $("pointsBar").style.width = pct + "%";

  const left = Math.max(0, cost - points);
  $("pointsHint").innerHTML = left > 0
    ? `Ещё <b>${left}</b> ${plural(left, "балл", "балла", "баллов")}, и можно крутить колесо`
    : `Можно крутить колесо! Хватит на <b>${Math.floor(points / cost)}</b> ${plural(Math.floor(points / cost), "вращение", "вращения", "вращений")}`;

  const c = d.counts || {};
  $("cWeek").textContent = c.week || 0;
  $("cMonth").textContent = c.month || 0;
  $("cAll").textContent = c.all || 0;

  state.prizes = d.prizes || [];
  renderWheel(state.prizes);
  renderPrizes();
  renderTop();

  const btn = $("spinBtn");
  btn.textContent = `Крутить колесо — ${cost} ${plural(cost, "балл", "балла", "баллов")}`;
  btn.disabled = points < cost || state.spinning;

  if (d.daily_bonus > 0) {
    toast(`+${d.daily_bonus} ${plural(d.daily_bonus, "балл", "балла", "баллов")} за сегодняшний вход 🎁`);
  }
}

function renderPrizes() {
  const box = $("prizeList");
  const list = state.prizes;
  if (!list.length) { box.innerHTML = `<div class="empty">Призы пока не добавлены.</div>`; return; }
  box.innerHTML = list.map((p, i) => {
    const kind = iconFor(p, i);
    return `<div class="prize-row">
      <span class="prize-ico">${ICONS[kind] || ICONS.snow}</span>
      <span class="prize-name">${escapeHtml(p.name)}${p.detail ? ` — <em>${escapeHtml(p.detail)}</em>` : ""}
        ${p.stock > 0 ? `<span class="prize-stock"> · осталось ${p.stock}</span>` : ""}</span>
      <span class="prize-pc">${p.chance}%</span>
    </div>`;
  }).join("");
}

function renderTop() {
  const box = $("topList");
  const rows = (state.data && state.data.top && state.data.top[state.period]) || [];
  if (!rows.length) { box.innerHTML = `<div class="empty">Пока нет данных.</div>`; return; }
  const medal = ["🥇", "🥈", "🥉"];
  box.innerHTML = rows.map((r, i) => `
    <div class="top-row${r.me ? " me" : ""}">
      <span class="top-pos">${medal[i] || i + 1}</span>
      <span class="top-name">${escapeHtml(r.name)}</span>
      <span class="top-c">${r.count}</span>
    </div>`).join("");
}

function plural(n, one, few, many) {
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b > 1 && b < 5) return few;
  if (b === 1) return one;
  return many;
}

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
}

let toastTimer = null;
function toast(msg) {
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("on"), 3200);
}

function showModal(ico, title, text) {
  $("modalIco").textContent = ico;
  $("modalTitle").textContent = title;
  $("modalText").textContent = text;
  $("modal").classList.add("on");
}

async function load() {
  if (PREVIEW) {
    $("previewBadge").classList.add("on");
    state.data = previewData();
    renderAll();
    return;
  }
  try {
    const d = await api("/api/me", { initData });
    if (d.error) { toast("Не удалось авторизоваться"); return; }
    state.data = d;
    renderAll();
  } catch (e) {
    toast("Не получилось загрузить данные");
  }
}

async function doSpin() {
  if (state.spinning) return;
  const d = state.data;
  if (!d) return;
  const cost = d.spin_cost || 100;
  if ((d.user.points || 0) < cost) { toast("Не хватает баллов"); return; }

  state.spinning = true;
  $("spinBtn").disabled = true;

  if (PREVIEW) {
    const n = Math.max(state.prizes.length, 1);
    const idx = Math.floor(Math.random() * n);
    spinTo(idx, n);
    setTimeout(() => {
      state.spinning = false;
      $("spinBtn").disabled = false;
      const p = state.prizes[idx];
      showModal("🎉", "Демо-режим", `Выпало: ${p ? p.name : "—"}. В Telegram здесь будет настоящий приз.`);
    }, 4800);
    return;
  }

  try {
    const r = await api("/api/spin", { initData });
    if (r.error) {
      state.spinning = false;
      $("spinBtn").disabled = false;
      toast(r.message || "Не удалось крутить");
      return;
    }
    const list = r.prizes || state.prizes;
    const n = Math.max(list.length, 1);
    const idx = Math.max(0, list.findIndex((p) => p.id === (r.prize && r.prize.id)));
    spinTo(idx, n);

    setTimeout(() => {
      state.spinning = false;
      if (r.points != null && state.data) state.data.user.points = r.points;
      if (r.prizes) state.prizes = r.prizes;
      renderAll();
      const name = r.prize ? r.prize.name : "—";
      const bonus = r.nothing_bonus ? ` Начислено +${r.nothing_bonus} баллов.` : "";
      showModal("🎉", "Поздравляем!", `Вам выпало: ${name}.${bonus} Остаток баллов: ${r.points}.`);
    }, 4800);
  } catch (e) {
    state.spinning = false;
    $("spinBtn").disabled = false;
    toast("Ошибка сети, попробуйте ещё раз");
  }
}

$("spinBtn").addEventListener("click", doSpin);
$("hub").addEventListener("click", doSpin);
$("modalClose").addEventListener("click", () => $("modal").classList.remove("on"));
$("modal").addEventListener("click", (e) => { if (e.target.id === "modal") $("modal").classList.remove("on"); });

$("btnClose").addEventListener("click", () => { if (tg && tg.close) tg.close(); else history.back(); });
$("btnMore").addEventListener("click", () => {
  if (tg && tg.showPopup) {
    tg.showPopup({
      title: "Full Bak Points",
      message: "Пишите комментарии под постами — получайте баллы и крутите колесо призов.",
      buttons: [{ type: "close" }],
    });
  } else {
    toast("Пишите комментарии — получайте баллы 🎁");
  }
});

document.querySelectorAll(".tab").forEach((tab) => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach((t) => t.classList.remove("on"));
    tab.classList.add("on");
    state.period = tab.dataset.period;
    renderTop();
  });
});

buildTree();
buildBottom();
startSnow();
load();
</script>
</body>
</html>
